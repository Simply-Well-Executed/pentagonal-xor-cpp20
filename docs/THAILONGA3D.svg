<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 480" role="img" aria-labelledby="title desc"><title id="title">3D THAILONGA reversible geometry</title><desc id="desc">Original vector 8,10,12 and primitive 4,5,6 are collinear, with scale 2. The right panel records exact reconstruction.</desc><rect width="840" height="480" rx="14" fill="#101d31"/><g font-family="Arial,sans-serif" fill="#f0f5fb"><text x="30" y="44" font-size="25" fill="#f0f5fb" >3D THAILONGA | reversible geometry</text><circle cx="250" cy="256" r="172" fill="#172f4b" stroke="#648bc5"/><g fill="none" stroke-width="1.5"><ellipse cx="250" cy="256" rx="172" ry="55" transform="rotate(-24 250 256)" stroke="#e88b93"/><ellipse cx="250" cy="256" rx="68" ry="172" transform="rotate(24 250 256)" stroke="#75d6b3"/><ellipse cx="250" cy="256" rx="172" ry="67" transform="rotate(35 250 256)" stroke="#78b5f5"/></g><line x1="88" y1="326" x2="412" y2="186" stroke="#e88b93" stroke-width="1" /><line x1="250" y1="420" x2="250" y2="90" stroke="#75d6b3" stroke-width="1" /><line x1="108" y1="148" x2="392" y2="364" stroke="#78b5f5" stroke-width="1" /><text x="416" y="185" font-size="15" fill="#e88b93" >X</text><text x="250" y="80" font-size="15" fill="#75d6b3" >Y</text><text x="398" y="378" font-size="15" fill="#78b5f5" >Z</text><line x1="250" y1="256" x2="354" y2="124" stroke="#f1cf78" stroke-width="3" /><circle cx="250" cy="256" r="4" fill="#ffffff"/><circle cx="302" cy="190" r="7" fill="#f1cf78"/><circle cx="354" cy="124" r="7" fill="#101d31" stroke="#f1cf78" stroke-width="3"/><text x="360" y="119" font-size="15" fill="#f1cf78" >Original</text><text x="309" y="186" font-size="15" fill="#f1cf78" >Core</text><rect x="455" y="89" width="350" height="334" rx="12" fill="#1b2c43" stroke="#3e5e81"/><text x="478" y="123" font-size="13" fill="#9fbbd9" >SOURCE</text><text x="478" y="153" font-size="27" fill="#f0f5fb" >(8, 10, 12)</text><text x="478" y="192" font-size="13" fill="#9fbbd9" >THAILONGA CORE</text><text x="478" y="222" font-size="27" fill="#f1cf78" >(4, 5, 6) × 2</text><text x="478" y="262" font-size="13" fill="#9fbbd9" >ARIRONG / PING</text><text x="478" y="292" font-size="27" fill="#75d6b3" >(8, 10, 12)</text><text x="478" y="335" font-size="17" fill="#f0f5fb" >XY / YZ / ZX: collinear</text><text x="478" y="365" font-size="15" fill="#f0f5fb" >Scale preserved; signs retained</text><text x="30" y="458" font-size="13" fill="#9fbbd9" >Orthographic schematic; display coordinates are not source measurements.</text></g></svg>
