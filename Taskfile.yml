# SPDX-License-Identifier: 0BSD
# Native T-CROSS policy manifest. Never place this under .github/workflows.
# Execution source is POSIX sh; the external Task CLI is optional, not required.
# Canonical local invocation: sh ci/t-cross-posix.sh
version: '3'

vars:
  BUILD_DIR: build
  BUILD_TYPE: Release
  # Reviewed operator assertions; not an automatically detected latest release.
  EXPECTED_PWSH_VERSION: '7.7.0'
  EXPECTED_CMAKE_VERSION: '3.30.0'
  T_CROSS_BASE_SHA: '313e25251243b85fb79f10c04236eb355beca1ce'

env:
  BUILD_DIR: '{{.BUILD_DIR}}'
  BUILD_TYPE: '{{.BUILD_TYPE}}'
  EXPECTED_PWSH_VERSION: '{{.EXPECTED_PWSH_VERSION}}'
  EXPECTED_CMAKE_VERSION: '{{.EXPECTED_CMAKE_VERSION}}'
  T_CROSS_BASE_SHA: '{{.T_CROSS_BASE_SHA}}'

tasks:
  default:
    desc: 'Run all strict, ordered, local T-CROSS gates without hosted runners'
    cmds:
      - task: emit-diff-yaml
      - task: gate-no-remote-git
      - task: gate-no-github-workflows
      - task: gate-no-live-rest
      - task: gate-no-std-throughput
      - task: gate-suite-no-comments
      - task: gate-no-std-repository
      - task: gate-no-residual-surfaces
      - task: gate-pinned-versions
      - task: build-cpp20
      - task: gate-zero-function-calls
      - task: gate-zero-network-imports
      - task: gate-no-std-binary
      - task: test-ctest

  gate-no-remote-git:
    desc: 'Reject configured remotes and dirty tracked files; no Git fetch'
    cmds:
      - sh ci/t-cross-posix.sh gate-no-remote-git

  gate-no-github-workflows:
    desc: 'Reject active .github/workflows YAML runners'
    cmds:
      - sh ci/t-cross-posix.sh gate-no-github-workflows

  gate-no-live-rest:
    desc: 'Reject network API/download candidates in CI, tools and CMake'
    cmds:
      - sh ci/t-cross-posix.sh gate-no-live-rest

  gate-no-std-throughput:
    desc: 'Require no standard-library headers or std names in seven native engine and suite files'
    cmds:
      - sh ci/t-cross-posix.sh gate-no-std-throughput

  gate-suite-no-comments:
    desc: 'Reject comment tokens in three Pentagonal Suite C++20 source files'
    cmds:
      - sh ci/t-cross-posix.sh gate-suite-no-comments

  gate-no-std-repository:
    desc: 'Strict red gate until all legacy C/C++ tracked sources are STD-free'
    cmds:
      - sh ci/t-cross-posix.sh gate-no-std-repository

  gate-no-residual-surfaces:
    desc: 'Reject retained Java, Docker and Android manual-use directories'
    cmds:
      - sh ci/t-cross-posix.sh gate-no-residual-surfaces

  gate-pinned-versions:
    desc: 'Require pinned local CMake; check PowerShell version only when pwsh is installed'
    cmds:
      - sh ci/t-cross-posix.sh gate-pinned-versions

  build-cpp20:
    desc: 'Configure ISO C++20: MSVC Release O2, GCC/Clang Release O3; compile locally'
    cmds:
      - sh ci/t-cross-posix.sh build-cpp20

  gate-zero-function-calls:
    desc: 'Inspect optimized canonical parity object only; do not claim zero CLI calls'
    cmds:
      - sh ci/t-cross-posix.sh gate-zero-function-calls

  gate-zero-network-imports:
    desc: 'Inspect parity, throughput and suite CLI imports; not runtime isolation proof'
    cmds:
      - sh ci/t-cross-posix.sh gate-zero-network-imports

  gate-no-std-binary:
    desc: 'Fail closed if throughput or suite binary directly imports C/C++ standard runtimes'
    cmds:
      - sh ci/t-cross-posix.sh gate-no-std-binary

  test-ctest:
    desc: 'Run parity, SWAR, suite operations and native CLI CTests locally'
    cmds:
      - sh ci/t-cross-posix.sh test-ctest

  emit-diff-yaml:
    desc: 'Derive a fresh +/-DIFF YAML audit from frozen base SHA and local Git HEAD'
    cmds:
      - sh ci/t-cross-posix.sh emit-diff-yaml > .iron-t-cross-diff.yml
