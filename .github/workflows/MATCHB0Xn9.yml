# SPDX-License-Identifier: 0BSD
# MATCHB0Xn9: independent per-PR whole circuits, then shared simplex
# opposite BIDI traversals, never >9 and never auto release.
name: MATCHB0Xn9 | Nine-circuit BIDI single-lane head-tail race
on:
  push:
    branches:
      - feat/quaddi-ni-oracle-cpp20-20261123
  workflow_dispatch:
permissions:
  contents: read
  pull-requests: read
concurrency:
  group: matchb0xn9-stack-${{ github.ref }}
  cancel-in-progress: false
jobs:
  stack-multiplexed-race:
    name: Each PR full circuit; then exclusive simplex BIDI race (max 9)
    runs-on: windows-2025
    timeout-minutes: 180
    permissions:
      contents: read
      pull-requests: read
    env:
      MSBUILDDISABLENODEREUSE: '1'
      DOTNET_CLI_DO_NOT_USE_MSBUILD_SERVER: '1'
    steps:
      - name: Acquire exact single SHA source in an isolated Windows scratchpad
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          Set-StrictMode -Version 2.0
          $ErrorActionPreference='Stop'
          if($env:GITHUB_ACTIONS -cne 'true' -or
             $env:RUNNER_OS -cne 'Windows' -or
             $env:GITHUB_REPOSITORY -cne 'Simply-Well-Executed/pentagonal-xor-cpp20' -or
             $env:GITHUB_REF -cne 'refs/heads/feat/quaddi-ni-oracle-cpp20-20261123' -or
             $env:GITHUB_SHA -cnotmatch '^[a-f0-9]{40}$'){
            throw 'MATCHB0Xn9|HOLD|unexpected_runner_or_ref'
          }
          $zip=Join-Path $env:RUNNER_TEMP 'matchb0xn9-harness.zip'
          $path=Join-Path $env:RUNNER_TEMP 'matchb0xn9-harness'
          $uri='https://api.github.com/repos/'+$env:GITHUB_REPOSITORY+'/zipball/'+$env:GITHUB_SHA
          Invoke-WebRequest -Uri $uri -Headers @{
            Authorization='Bearer '+$env:GH_TOKEN
            Accept='application/vnd.github+json'
            'X-GitHub-Api-Version'='2022-11-28'
            'User-Agent'='swe-matchb0xn9-stack'
          } -OutFile $zip -MaximumRedirection 5
          Expand-Archive -LiteralPath $zip -DestinationPath $path
          $roots=@(Get-ChildItem -LiteralPath $path -Directory)
          if($roots.Count -ne 1 -or
             -not [IO.File]::Exists((Join-Path $roots[0].FullName 'ci/Invoke-Matchb0xn9Stack.ps1')) -or
             -not [IO.File]::Exists((Join-Path $roots[0].FullName 'ci/Invoke-Matchb0xn9Race.ps1'))){
            throw 'MATCHB0Xn9|HOLD|harness_source_incomplete'
          }
          [IO.File]::WriteAllText((Join-Path $env:RUNNER_TEMP 'matchb0xn9-root.txt'),$roots[0].FullName)
      - name: Qualify each whole PR circuit then BIDI on green only
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          Set-StrictMode -Version 2.0
          $ErrorActionPreference='Stop'
          $root=[IO.File]::ReadAllText((Join-Path $env:RUNNER_TEMP 'matchb0xn9-root.txt'))
          & pwsh -NoLogo -NoProfile -NonInteractive -File (Join-Path $root 'ci/Invoke-Matchb0xn9Stack.ps1') -HarnessRoot $root -EvidenceDirectory (Join-Path $env:RUNNER_TEMP 'matchb0xn9-point0') -ExpectedTopSha $env:GITHUB_SHA
          if($LASTEXITCODE -ne 0){throw 'MATCHB0Xn9|HOLD|stack_or_counterflow_not_qualified'}
      - name: Preserve human-release and personal-agency safeguards
        if: always()
        shell: pwsh
        run: |
          Write-Host 'MATCHB0Xn9|MAX_CIRCUITS=9|BIDI=HALF_DUPLEX|SINGLE_LANE=EXCLUSIVE|NO_AUTO_MERGE|NO_RELEASE|NO_FORCE|RELEASE=HOLD'
