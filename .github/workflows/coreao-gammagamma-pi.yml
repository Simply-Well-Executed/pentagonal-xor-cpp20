name: COREAO GammaGamma Pi precision C++20 O2
on:
  pull_request:
    paths:
      - 'shared/gammagamma.hpp'
      - 'shared/pi_precision.hpp'
      - 'shared/toolong.hpp'
      - 'shared/toolong_bits.hpp'
      - 'shared/toolong_ratio.hpp'
      - 'shared/toolong_photon_model.hpp'
      - 'tests/toolong_arithmetic_test.cpp'
      - 'tools/toolong_arithmetic_demo.cpp'
      - 'docs/TOOLONG.md'
      - 'CMakeLists.txt'
      - 'tools/gammagamma_pi_precision_demo.cpp'
      - 'tests/gammagamma_pi_precision_test.cpp'
      - 'docs/GAMMAGAMMA_PI_PRECISION.md'
      - '.github/workflows/coreao-gammagamma-pi.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  pondaz:
    uses: ./.github/workflows/pondaz.yml

  validate:
    needs: pondaz
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install C++20 GCC 14
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y g++-14
      - name: Configure CMake package for installed public headers
        run: |
          cmake -S . -B /tmp/toolong-package -DBUILD_TESTING=OFF -DCMAKE_BUILD_TYPE=Release
      - name: Compile explicitly optimized at O2
        run: |
          g++-14 -std=c++20 -O2 -Wall -Wextra -Wpedantic -Werror -fstack-protector-strong -D_FORTIFY_SOURCE=2 tests/gammagamma_pi_precision_test.cpp -o /tmp/gammagamma_pi_precision_test
          g++-14 -std=c++20 -O2 -Wall -Wextra -Wpedantic -Werror -fstack-protector-strong -D_FORTIFY_SOURCE=2 tools/gammagamma_pi_precision_demo.cpp -o /tmp/gammagamma_pi_precision_demo
      - name: Compile exact arbitrary precision arithmetic at O2
        run: |
          g++-14 -std=c++20 -O2 -Wall -Wextra -Wpedantic -Werror -fstack-protector-strong -D_FORTIFY_SOURCE=2 tests/toolong_arithmetic_test.cpp -o /tmp/toolong_arithmetic_test
          g++-14 -std=c++20 -O2 -Wall -Wextra -Wpedantic -Werror -fstack-protector-strong -D_FORTIFY_SOURCE=2 tools/toolong_arithmetic_demo.cpp -o /tmp/toolong_arithmetic_demo
      - name: Verify toolong arithmetic and count-statistics
        run: |
          /tmp/toolong_arithmetic_test
          /tmp/toolong_arithmetic_demo
      - name: Verify integer components and presentation
        run: |
          /tmp/gammagamma_pi_precision_test
          /tmp/gammagamma_pi_precision_demo
