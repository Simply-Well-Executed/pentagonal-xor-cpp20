# SPDX-License-Identifier: 0BSD
# JSTAR isolated experiment. Never repair source, merge, release, or auto-approve.
name: JSTAR Oracle 27 raw vcxproj and full native MSVC evidence
on:
  push:
    branches:
      - experiment/oracle-jdk27-vcxproj-diagnostics-20261121
  workflow_dispatch:

permissions:
  contents: write

jobs:
  jstar:
    name: MSVC full C++20 O2 build + literal Oracle javac vcxproj probe
    runs-on: windows-2025
    timeout-minutes: 90
    steps:
      - name: Obtain exact source commit without Node checkout
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          Set-StrictMode -Version Latest
          $ErrorActionPreference='Stop'
          if($env:GITHUB_REPOSITORY -cne 'Simply-Well-Executed/pentagonal-xor-cpp20' -or
             $env:GITHUB_REF -cne 'refs/heads/experiment/oracle-jdk27-vcxproj-diagnostics-20261121' -or
             $env:GITHUB_SHA -cnotmatch '^[0-9a-f]{40}$' -or
             $env:RUNNER_OS -cne 'Windows') {throw 'JSTAR|HOLD|untrusted_run_context'}
          $zip=Join-Path $env:RUNNER_TEMP 'jstar-source.zip'
          $dir=Join-Path $env:RUNNER_TEMP 'jstar-source'
          $url='https://api.github.com/repos/'+$env:GITHUB_REPOSITORY+'/zipball/'+$env:GITHUB_SHA
          Invoke-WebRequest -Uri $url -OutFile $zip -Headers @{
            Authorization='Bearer '+$env:GH_TOKEN
            Accept='application/vnd.github+json'
            'X-GitHub-Api-Version'='2022-11-28'
            'User-Agent'='swe-jstar-experiment'
          }
          Expand-Archive -LiteralPath $zip -DestinationPath $dir
          $roots=@(Get-ChildItem -LiteralPath $dir -Directory)
          if($roots.Count -ne 1 -or
             -not [IO.File]::Exists((Join-Path $roots[0].FullName 'ci/Assert-TriforceHeadTail.ps1'))) {
            throw 'JSTAR|HOLD|source_invalid'
          }
          [IO.File]::WriteAllText((Join-Path $env:RUNNER_TEMP 'jstar-root.txt'),$roots[0].FullName)
      - name: Native full build, Oracle exact probe, and JSTAR custody
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          Set-StrictMode -Version Latest
          $ErrorActionPreference='Stop'
          $PSNativeCommandUseErrorActionPreference=$false
          $root=[IO.File]::ReadAllText((Join-Path $env:RUNNER_TEMP 'jstar-root.txt'))
          $evidence=Join-Path $env:RUNNER_TEMP 'jstar-evidence'
          $native=Join-Path $evidence 'native'
          $full=Join-Path $evidence 'full'
          [void][IO.Directory]::CreateDirectory($evidence)
          $guard=Join-Path $root 'ci/Assert-TriforceHeadTail.ps1'
          $guardState=Join-Path $evidence 'head-tail'
          $runResult=[ordered]@{
            schema='JSTAR-1'
            commit=[string]$env:GITHUB_SHA
            run=[string]$env:GITHUB_RUN_ID
            source_test_sha256=(Get-FileHash (Join-Path $root 'tests/toolong_arithmetic_test.cpp') -Algorithm SHA256).Hash.ToLowerInvariant()
            native_configure=-999
            native_build=-999
            native_execute=-999
            root_configure=-999
            full_native_build=-999
            isolated_toolong_build=-999
            ctest=-999
            oracle_archive='NOT_RUN'
            oracle_javac_version='NOT_RUN'
            javac_raw_vcxproj_exit=-999
            release='HOLD'
          }
          function Gate([string]$operation,[string]$phase) {
            & pwsh -NoLogo -NoProfile -NonInteractive -File $guard -RepositoryRoot $root -EvidenceDirectory $guardState -Operation $operation -Phase $phase
            if($LASTEXITCODE -ne 0) {throw ('JSTAR|HOLD|TRIFORCE|'+$operation+'|'+$phase)}
          }
          function Capture([string]$label,[string]$executable,[string[]]$arguments) {
            $log=Join-Path $evidence ($label+'.log')
            $code=999
            try {
              $global:LASTEXITCODE=0
              & $executable @arguments *> $log
              $code=[int]$LASTEXITCODE
            } catch {
              [IO.File]::AppendAllText($log,($_|Out-String))
            }
            Write-Host ('JSTAR|'+$label+'|EXIT='+$code)
            return $code
          }
          Gate 'jstar_configure' 'HEAD'
          $runResult.native_configure=Capture 'native-configure' 'cmake' @('-S',(Join-Path $root 'ci/triforce'),'-B',$native,'-G','Visual Studio 18 2026','-A','x64')
          $runResult.root_configure=Capture 'full-configure' 'cmake' @('-S',$root,'-B',$full,'-G','Visual Studio 18 2026','-A','x64','-DBUILD_TESTING=ON','-DSWE_STD_FREE_CORE_ONLY=OFF')
          Gate 'jstar_configure' 'TAIL'
          Gate 'jstar_fullbuild' 'HEAD'
          if($runResult.native_configure -eq 0) {
            $runResult.native_build=Capture 'native-build' 'cmake' @('--build',$native,'--config','Release','--parallel','4')
            $exe=Join-Path $native 'Release/triforce_native_gate.exe'
            if($runResult.native_build -eq 0 -and [IO.File]::Exists($exe)) {
              $runResult.native_execute=Capture 'native-execute' $exe @()
            }
          }
          if($runResult.root_configure -eq 0) {
            $runResult.full_native_build=Capture 'full-build' 'cmake' @('--build',$full,'--config','Release','--parallel','4')
            $runResult.isolated_toolong_build=Capture 'isolated-toolong' 'cmake' @('--build',$full,'--config','Release','--target','toolong_arithmetic_test','--parallel','1')
            $runResult.ctest=Capture 'all-ctest' 'ctest' @('--test-dir',$full,'-C','Release','--output-on-failure','--no-tests=error','--parallel','4')
          }
          Gate 'jstar_fullbuild' 'TAIL'
          Gate 'jstar_oracle' 'HEAD'
          $officialUrl='https://download.oracle.com/java/27/latest/jdk-27_windows-x64_bin.zip'
          $officialSha='9a2972e8ade166718fdc47e903b10b88e046b9839efb0a5cacb994a4be3266f7'
          $oracleZip=Join-Path $evidence 'oracle-jdk27.zip'
          $oracleDir=Join-Path $evidence 'oracle'
          $javac=$null
          try {
            Invoke-WebRequest -Uri $officialUrl -OutFile $oracleZip -MaximumRedirection 3
            $actual=(Get-FileHash -LiteralPath $oracleZip -Algorithm SHA256).Hash.ToLowerInvariant()
            if($actual -cne $officialSha) {throw ('JSTAR|HOLD|Oracle_SHA256_mismatch|'+$actual)}
            Expand-Archive -LiteralPath $oracleZip -DestinationPath $oracleDir
            $candidates=@(Get-ChildItem -LiteralPath $oracleDir -Recurse -File -Filter 'javac.exe')
            if($candidates.Count -ne 1) {throw 'JSTAR|HOLD|Oracle_javac_unavailable_or_ambiguous'}
            $javac=$candidates[0].FullName
            $runResult.oracle_archive='NFTC_27.0.1.1_SHA256_VERIFIED'
            $runResult.oracle_javac_version=(& $javac -version 2>&1 | Out-String).Trim()
            [IO.File]::WriteAllText((Join-Path $evidence 'oracle-custody.txt'),('URL='+$officialUrl+[Environment]::NewLine+'SHA256='+$actual+[Environment]::NewLine+'LICENSE=Oracle NFTC'+[Environment]::NewLine))
          } catch {
            $runResult.oracle_archive='FAILED'
            [IO.File]::WriteAllText((Join-Path $evidence 'oracle-fetch-error.log'),($_|Out-String))
          }
          $project=Join-Path $full 'toolong_arithmetic_test.vcxproj'
          if($null -ne $javac -and [IO.File]::Exists($project)) {
            $runResult.javac_raw_vcxproj_exit=Capture 'javac-literal-vcxproj' $javac @($project)
          }
          Gate 'jstar_oracle' 'TAIL'
          # JSTAR ROT13 diagnostic feedback: raw byte IO, no source edits.
          # A compiler may ignore stdin; never label this a successful C++ compile.
          Gate 'jstar_rot13_io' 'HEAD'
          $ioDir=Join-Path $evidence 'java-io'
          [void][IO.Directory]::CreateDirectory($ioDir)
          function IOHash([byte[]]$inputBytes) {
            return [Convert]::ToHexString([Security.Cryptography.SHA256]::HashData($inputBytes)).ToLowerInvariant()
          }
          function Invoke-JavacByteIO([string]$tag,[byte[]]$stdinBytes) {
            $psi=[Diagnostics.ProcessStartInfo]::new()
            $psi.FileName=$javac
            [void]$psi.ArgumentList.Add($project)
            $psi.UseShellExecute=$false
            $psi.CreateNoWindow=$true
            $psi.RedirectStandardInput=$true
            $psi.RedirectStandardOutput=$true
            $psi.RedirectStandardError=$true
            $proc=[Diagnostics.Process]::new()
            $proc.StartInfo=$psi
            $outStream=[IO.MemoryStream]::new()
            $errStream=[IO.MemoryStream]::new()
            $stdinError=''
            try {
              if(-not $proc.Start()){throw 'JSTAR|HOLD|javac_process_not_started'}
              $stdoutTask=$proc.StandardOutput.BaseStream.CopyToAsync($outStream)
              $stderrTask=$proc.StandardError.BaseStream.CopyToAsync($errStream)
              try {
                if($stdinBytes.Length -gt 0) {
                  $proc.StandardInput.BaseStream.Write($stdinBytes,0,$stdinBytes.Length)
                  $proc.StandardInput.BaseStream.Flush()
                }
              } catch {
                # javac may not read stdin; retain this evidence instead of assuming consumption.
                $stdinError=($_|Out-String)
              } finally {
                try{$proc.StandardInput.Close()}catch{}
              }
              if(-not $proc.WaitForExit(120000)) {
                $proc.Kill($true)
                throw 'JSTAR|HOLD|javac_120s_timeout'
              }
              $stdoutTask.GetAwaiter().GetResult()
              $stderrTask.GetAwaiter().GetResult()
              $rawStdout=$outStream.ToArray()
              $rawStderr=$errStream.ToArray()
              if($rawStdout.Length -gt 2097152 -or $rawStderr.Length -gt 2097152) {
                throw 'JSTAR|HOLD|javac_io_exceeds_2MiB_per_channel'
              }
              [IO.File]::WriteAllBytes((Join-Path $ioDir ($tag+'-stdin.bin')),$stdinBytes)
              [IO.File]::WriteAllBytes((Join-Path $ioDir ($tag+'-stdout.bin')),$rawStdout)
              [IO.File]::WriteAllBytes((Join-Path $ioDir ($tag+'-stderr.bin')),$rawStderr)
              [IO.File]::WriteAllText((Join-Path $ioDir ($tag+'-stdin-write-error.txt')),$stdinError,[Text.UTF8Encoding]::new($false))
              Write-Host ('JSTAR|IO|'+$tag+'|EXIT='+$proc.ExitCode+
                '|IN_SHA256='+(IOHash $stdinBytes)+
                '|OUT_SHA256='+(IOHash $rawStdout)+
                '|ERR_SHA256='+(IOHash $rawStderr))
              return [pscustomobject]@{
                exit=[int]$proc.ExitCode
                stdout=$rawStdout
                stderr=$rawStderr
                stdinWriteError=$stdinError
              }
            } finally {
              $outStream.Dispose()
              $errStream.Dispose()
              $proc.Dispose()
            }
          }
          function Invoke-Rot13Bytes([byte[]]$inputBytes) {
            $outBytes=[byte[]]::new($inputBytes.Length)
            for($i=0;$i -lt $inputBytes.Length;$i++){
              $b=[int]$inputBytes[$i]
              if($b -ge 65 -and $b -le 90){$b=65+(($b-65+13)%26)}
              elseif($b -ge 97 -and $b -le 122){$b=97+(($b-97+13)%26)}
              $outBytes[$i]=[byte]$b
            }
            return ,$outBytes
          }
          function Invoke-MagicCombIO([byte[]]$inputBytes) {
            # Same text transform as ci/Invoke-MagicComb.ps1 without running
            # its source-tree Apply/Verify mode on derived compiler evidence.
            $utf8=[Text.UTF8Encoding]::new($false,$true)
            $text=$utf8.GetString($inputBytes)
            $cleaned=[regex]::Replace($text.Normalize([Text.NormalizationForm]::FormKC),
              '[\u200B-\u200D\uFEFF]','')
            return ,$utf8.GetBytes($cleaned)
          }
          $runResult.javac_rot13_feedback='NOT_RUN'
          $runResult.javac_raw_byte_exit=-999
          $runResult.javac_rot13_replay_exit=-999
          $runResult.javac_io_encoding='UTF8_STRICT_NFKC_ZERO_WIDTH_CLEAN'
          if($null -ne $javac -and [IO.File]::Exists($project)) {
            $fresh=Invoke-JavacByteIO 'javac-exit2-original' ([byte[]]::new(0))
            $runResult.javac_raw_byte_exit=$fresh.exit
            if($fresh.exit -eq 2) {
              # stdout and stderr are separately preserved. Their ordering
              # across channels cannot be reconstructed from captured pipes.
              $rOut=Invoke-Rot13Bytes $fresh.stdout
              $rErr=Invoke-Rot13Bytes $fresh.stderr
              [IO.File]::WriteAllBytes((Join-Path $ioDir 'rot13-stdout.bin'),$rOut)
              [IO.File]::WriteAllBytes((Join-Path $ioDir 'rot13-stderr.bin'),$rErr)
              $feed=[Collections.Generic.List[byte]]::new()
              $feed.AddRange($rOut)
              if($rOut.Length -gt 0 -and $rErr.Length -gt 0){$feed.Add([byte]10)}
              $feed.AddRange($rErr)
              $rot13Payload=$feed.ToArray()
              [IO.File]::WriteAllBytes((Join-Path $ioDir 'rot13-uncombed-stdin.bin'),$rot13Payload)
              try {
                $combedFeed=Invoke-MagicCombIO $rot13Payload
                [IO.File]::WriteAllBytes((Join-Path $ioDir 'rot13-magiccomb-stdin.bin'),$combedFeed)
                $replayed=Invoke-JavacByteIO 'javac-rot13-replayed' $combedFeed
                $runResult.javac_rot13_replay_exit=$replayed.exit
                $combReplayStdout=Invoke-MagicCombIO $replayed.stdout
                $combReplayStderr=Invoke-MagicCombIO $replayed.stderr
                [IO.File]::WriteAllBytes((Join-Path $ioDir 'replay-magiccomb-stdout.bin'),$combReplayStdout)
                [IO.File]::WriteAllBytes((Join-Path $ioDir 'replay-magiccomb-stderr.bin'),$combReplayStderr)
                $runResult.javac_rot13_feedback='OBSERVED_TWO_PASSES'
                $runResult.javac_rot13_original_stdout_sha256=IOHash $fresh.stdout
                $runResult.javac_rot13_original_stderr_sha256=IOHash $fresh.stderr
                $runResult.javac_rot13_replay_stdin_sha256=IOHash $combedFeed
                $runResult.javac_rot13_replay_stdout_sha256=IOHash $replayed.stdout
                $runResult.javac_rot13_replay_stderr_sha256=IOHash $replayed.stderr
                $runResult.javac_rot13_postcomb_stdout_sha256=IOHash $combReplayStdout
                $runResult.javac_rot13_postcomb_stderr_sha256=IOHash $combReplayStderr
                $runResult.javac_rot13_stdin_consumption='NOT_ESTABLISHED_BY_PIPE_WRITE'
                Write-Host ('JSTAR|ROT13|EXIT2_REPLAY='+$replayed.exit+'|MAGICCOMB|EVIDENCE_ONLY|RELEASE=HOLD')
              } catch {
                $runResult.javac_rot13_feedback='FAILED_REPLAY_OR_UTF8_CHECK'
                [IO.File]::WriteAllText((Join-Path $ioDir 'rot13-magiccomb-exception.txt'),($_|Out-String),[Text.UTF8Encoding]::new($false))
              }
            } else {
              $runResult.javac_rot13_feedback='FIRST_RAW_JAVAC_NOT_EXIT2'
            }
          } else {
            $runResult.javac_rot13_feedback='NO_VALIDATED_JAVAC_OR_GENERATED_PROJECT'
          }
          Gate 'jstar_rot13_io' 'TAIL'
          Gate 'jstar_custody' 'HEAD'
          $payload=Join-Path $evidence 'payload'
          $generated=Join-Path $payload 'generated'
          [void][IO.Directory]::CreateDirectory($generated)
          foreach($build in @($native,$full)) {
            if(-not [IO.Directory]::Exists($build)) {continue}
            if($build -ceq $native) {$sub='native'} else {$sub='full'}
            foreach($file in Get-ChildItem -LiteralPath $build -File -Recurse) {
              if($file.Extension -notin @('.vcxproj','.filters','.sln','.exe','.lib','.pdb')) {continue}
              $target=Join-Path $generated (Join-Path $sub ([IO.Path]::GetRelativePath($build,$file.FullName)))
              [void][IO.Directory]::CreateDirectory((Split-Path -Parent $target))
              Copy-Item -LiteralPath $file.FullName -Destination $target
            }
          }
          $preserved=Join-Path $generated 'full/toolong_arithmetic_test.vcxproj'
          if(-not [IO.File]::Exists($preserved)) {throw 'JSTAR|HOLD|no_generated_project'}
          $runResult.vcxproj_sha256=(Get-FileHash -LiteralPath $preserved -Algorithm SHA256).Hash.ToLowerInvariant()
          $ioPayload=Join-Path $payload 'java-io'
          if([IO.Directory]::Exists($ioDir)) {
            Copy-Item -LiteralPath $ioDir -Destination $ioPayload -Recurse
          }
          $resultFile=Join-Path $payload 'JSTAR-results.json'
          [IO.File]::WriteAllText($resultFile,($runResult|ConvertTo-Json -Depth 5),[Text.UTF8Encoding]::new($false))
          foreach($file in Get-ChildItem -LiteralPath $evidence -File | Where-Object {$_.Extension -in @('.log','.txt')}) {
            Copy-Item -LiteralPath $file.FullName -Destination (Join-Path $payload $file.Name)
          }
          $inventory=Join-Path $payload 'JSTAR-file-inventory.tsv'
          $records=[Collections.Generic.List[string]]::new()
          [void]$records.Add(('path'+[char]9+'bytes'+[char]9+'sha256'))
          foreach($file in Get-ChildItem -LiteralPath $payload -File -Recurse | Sort-Object FullName) {
            $name=[IO.Path]::GetRelativePath($payload,$file.FullName).Replace([IO.Path]::DirectorySeparatorChar,'/')
            $hash=(Get-FileHash -LiteralPath $file.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
            [void]$records.Add(($name+[char]9+$file.Length+[char]9+$hash))
          }
          [IO.File]::WriteAllLines($inventory,$records,[Text.UTF8Encoding]::new($false))
          $bundle=Join-Path $evidence 'JSTAR-evidence.zip'
          Compress-Archive -Path (Join-Path $payload '*') -DestinationPath $bundle -CompressionLevel Optimal
          $digest=(Get-FileHash -LiteralPath $bundle -Algorithm SHA256).Hash.ToLowerInvariant()
          $shaPath=Join-Path $evidence 'JSTAR-evidence.zip.sha256'
          [IO.File]::WriteAllText($shaPath,($digest+'  JSTAR-evidence.zip'+[Environment]::NewLine),[Text.UTF8Encoding]::new($false))
          Gate 'jstar_custody' 'TAIL'
          function CommitEvidence([string]$filename,[string]$filepath) {
            $branch='evidence/jstar-oracle27-20261121'
            $path='JSTAR/'+$env:GITHUB_SHA+'/'+$env:GITHUB_RUN_ID+'/'+$filename
            $bytes=[IO.File]::ReadAllBytes($filepath)
            $data=@{branch=$branch; message=('JSTAR custody: '+$filename); content=[Convert]::ToBase64String($bytes)}|ConvertTo-Json -Compress
            $url='https://api.github.com/repos/'+$env:GITHUB_REPOSITORY+'/contents/'+$path
            $response=Invoke-RestMethod -Uri $url -Method Put -ContentType 'application/json' -Headers @{
              Authorization='Bearer '+$env:GH_TOKEN
              Accept='application/vnd.github+json'
              'X-GitHub-Api-Version'='2022-11-28'
              'User-Agent'='swe-jstar-custody'
            } -Body $data
            if($response.content.path -cne $path) {throw 'JSTAR|HOLD|custody_write_response_invalid'}
            Write-Host ('JSTAR|CUSTODY|'+$path+'|COMMIT='+$response.commit.sha)
          }
          CommitEvidence 'toolong_arithmetic_test.vcxproj' $preserved
          CommitEvidence 'JSTAR-results.json' $resultFile
          if([IO.Directory]::Exists($ioDir)) {
            foreach($ioFile in Get-ChildItem -LiteralPath $ioDir -File | Sort-Object Name) {
              CommitEvidence ('IO-'+$ioFile.Name) $ioFile.FullName
            }
          }
          foreach($label in @('full-build','isolated-toolong','all-ctest','javac-literal-vcxproj','native-build','native-execute')) {
            $log=Join-Path $evidence ($label+'.log')
            if([IO.File]::Exists($log)) {CommitEvidence ($label+'.log') $log}
          }
          CommitEvidence 'JSTAR-evidence.zip' $bundle
          CommitEvidence 'JSTAR-evidence.zip.sha256' $shaPath
          $summary= @(
            '### JSTAR experimental evidence',
            ('Source commit: '+$env:GITHUB_SHA),
            ('Native full build exit: '+$runResult.full_native_build),
            ('TOOLONG target exit: '+$runResult.isolated_toolong_build),
            ('Oracle JDK: '+$runResult.oracle_archive),
            ('Raw javac vcxproj exit: '+$runResult.javac_raw_vcxproj_exit),
            ('Raw byte javac exit: '+$runResult.javac_raw_byte_exit),
            ('ROT13 replay javac exit: '+$runResult.javac_rot13_replay_exit),
            ('ROT13 and MagicComb evidence: '+$runResult.javac_rot13_feedback),
            ('Evidence ZIP SHA-256: '+$digest),
            'Release: HOLD. No repair, no approval, no PR.'
          ) -join [Environment]::NewLine
          Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY -Value $summary
          if($runResult.full_native_build -ne 0 -or $runResult.native_execute -ne 0 -or $runResult.ctest -ne 0) {
            throw 'JSTAR|HOLD|native_compilation_or_test_failed|evidence_committed'
          }
