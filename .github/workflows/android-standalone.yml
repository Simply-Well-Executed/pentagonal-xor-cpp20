name: 'Android · Gradle-free SDK validation'

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-direct-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  pondaz:
    name: 'Pondaz · preflight before all job lanes'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: 'Checkout exact source SHA using PowerShell Core'
        shell: pwsh
        run: |
          Set-StrictMode -Version 2.0
          $ErrorActionPreference = 'Stop'
          if ($env:GITHUB_REPOSITORY -cne 'Simply-Well-Executed/pentagonal-xor-cpp20') { throw 'Unexpected repository' }
          & git init .
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & git remote add origin 'https://github.com/Simply-Well-Executed/pentagonal-xor-cpp20.git'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & git -c advice.detachedHead=false fetch --no-tags --depth 1 origin $env:GITHUB_REF
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & git -c advice.detachedHead=false checkout --detach FETCH_HEAD
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $actual = (& git rev-parse HEAD).Trim()
          if ($LASTEXITCODE -ne 0 -or $actual -cne $env:GITHUB_SHA) { throw 'Pondaz source SHA mismatch' }
      - name: 'Run Pondaz fixture and tracked-text/event input audit'
        shell: pwsh
        run: |
          Set-StrictMode -Version 2.0
          & ./ci/Invoke-Pondaz.ps1 -SelfTest
          if (-not $?) { throw 'Pondaz fixture suite failed' }
          & ./ci/Invoke-Pondaz.ps1 -RepositoryRoot . -EventPath $env:GITHUB_EVENT_PATH -EvidenceDir pondaz-evidence
          if (-not $?) { throw 'Pondaz rejected untrusted input' }

  android-sdk:
    needs: pondaz
    name: 'Standalone Java 17 + SDK 35 APK · no Gradle'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: 'Checkout source'
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: 'Prepare evidence before tests'
        shell: pwsh
        run: New-Item -ItemType Directory -Force evidence-android | Out-Null

      - name: 'Pre-flight: inspect release source'
        shell: pwsh
        run: ./ci/Test-ReleaseSafety.ps1
      - name: 'Regression: release-gate negative fixtures and real pauses'
        shell: pwsh
        run: ./ci/Test-ReleaseSafetyPolicy.ps1

      - name: 'Java 17'
        uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: '17'

      - name: 'Validate Android SDK manager'
        shell: pwsh
        run: |
          if ([string]::IsNullOrWhiteSpace($env:ANDROID_HOME)) { throw 'ANDROID_HOME unset' }
          $path = Join-Path $env:ANDROID_HOME 'cmdline-tools/latest/bin'
          if (!(Test-Path -LiteralPath (Join-Path $path 'sdkmanager'))) {
            throw 'Pinned Android SDK manager unavailable'
          }
          Add-Content -LiteralPath $env:GITHUB_PATH -Value $path

      - name: 'Install Android SDK platform and build tools 35'
        shell: pwsh
        run: |
          & sdkmanager 'platforms;android-35' 'build-tools;35.0.0' *>&1 |
            Tee-Object -FilePath evidence-android/android-sdk.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: 'Independent test, compile, package and verify APK'
        shell: pwsh
        run: |
          ./ci/Build-Android.ps1 *>&1 |
            Tee-Object -FilePath evidence-android/build-and-test.log
          if (!$?) { exit 1 }

      - name: 'Fingerprint Android APK and SDK/JDK binaries even on failure'
        if: ${{ !cancelled() }}
        shell: pwsh
        run: ./ci/Write-AndroidEvidence.ps1 -EvidenceDir evidence-android

      - name: 'Upload debug APK, only if actually built'
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: Android-Gradle-free-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: warn
          retention-days: 90

      - name: 'Upload failure/success evidence'
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: Android-Gradle-free-evidence
          path: evidence-android/
          if-no-files-found: warn
          retention-days: 90
