name: COREAO stage 10 isolated OCI evidence, one-shot publish
# SPDX-License-Identifier: 0BSD
# This publishes a Linux/amd64 provenance diagnostic, NEVER an OpenBSD binary.
# One explicit publish(coreao): commit only, no merge, no latest tag.
on:
  push:
    branches:
      - feat/fresh-artistic-eye-chain-20261120
    paths:
      - .github/workflows/openbsd2-coreao-oci-once.yml
permissions:
  contents: read
  packages: write
concurrency:
  group: coreao-openbsd2-evidence-once
  cancel-in-progress: false
jobs:
  build-validate-publish:
    if: >-
      github.repository == 'Simply-Well-Executed/pentagonal-xor-cpp20' &&
      github.ref == 'refs/heads/feat/fresh-artistic-eye-chain-20261120' &&
      startsWith(github.event.head_commit.message, 'publish(coreao):')
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
    steps:
      - name: Recover exact GitHub commit source without Node actions
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference='Stop'
          if($env:GITHUB_ACTIONS -cne 'true' -or
             $env:GITHUB_REPOSITORY -cne 'Simply-Well-Executed/pentagonal-xor-cpp20' -or
             $env:RUNNER_ENVIRONMENT -cne 'github-hosted' -or
             $env:GITHUB_SHA -cnotmatch '^[0-9a-f]{40}$'){
            throw 'COREAO|OCI|HOLD|invalid_host_or_source_revision'
          }
          $zip=Join-Path $env:RUNNER_TEMP 'coreao-oci-source.zip'
          $dest=Join-Path $env:RUNNER_TEMP 'coreao-oci-source'
          $uri='https://api.github.com/repos/'+$env:GITHUB_REPOSITORY+'/zipball/'+$env:GITHUB_SHA
          Invoke-WebRequest -Uri $uri -Headers @{Authorization=('Bearer '+$env:GH_TOKEN);
             Accept='application/vnd.github+json';
             'X-GitHub-Api-Version'='2022-11-28';
             'User-Agent'='swe-coreao-evidence'} -OutFile $zip -MaximumRedirection 5
          Expand-Archive -LiteralPath $zip -DestinationPath $dest
          $dirs=@(Get-ChildItem -LiteralPath $dest -Directory)
          if($dirs.Count -ne 1 -or
             -not [IO.File]::Exists((Join-Path $dirs[0].FullName 'ci/Invoke-OpenBSDSerialCoreao.ps1'))){
            throw 'COREAO|OCI|HOLD|bad_source_archive'
          }
          [IO.File]::WriteAllText((Join-Path $env:RUNNER_TEMP 'coreao-oci-root.txt'),$dirs[0].FullName)
      - name: Reconcile stage 10, compile C++20 O2, execute Docker HEAD and TAIL
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $root=[IO.File]::ReadAllText((Join-Path $env:RUNNER_TEMP 'coreao-oci-root.txt'))
          $image='ghcr.io/simply-well-executed/pentagonal-xor-cpp20-coreao-evidence:sha-'+$env:GITHUB_SHA
          & pwsh -NoLogo -NoProfile -File (Join-Path $root 'ci/Build-OpenBSD2CoreaoEvidenceOci.ps1') -RepositoryRoot $root -WorkingDirectory (Join-Path $env:RUNNER_TEMP 'coreao-oci-build') -ImageTag $image
          if($LASTEXITCODE -ne 0){throw 'COREAO|OCI|HOLD|build_or_runtime_test_failed'}
      - name: Publish immutable evidence package to GHCR
        shell: pwsh
        env:
          GHCR_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference='Stop'
          if([string]::IsNullOrWhiteSpace($env:GHCR_TOKEN)){throw 'COREAO|GHCR|HOLD|token_missing'}
          $image='ghcr.io/simply-well-executed/pentagonal-xor-cpp20-coreao-evidence:sha-'+$env:GITHUB_SHA
          $env:GHCR_TOKEN | docker login ghcr.io --username $env:GITHUB_ACTOR --password-stdin
          if($LASTEXITCODE -ne 0){throw 'COREAO|GHCR|HOLD|login_failed'}
          $output=@(& docker push $image 2>&1)
          foreach($line in $output){Write-Host $line}
          if($LASTEXITCODE -ne 0){throw 'COREAO|GHCR|HOLD|push_failed'}
          $digestMatch=[regex]::Match(($output -join [char]10),'digest: (sha256:[0-9a-f]{64})')
          if(-not $digestMatch.Success){throw 'COREAO|GHCR|HOLD|remote_digest_not_reported'}
          Write-Host ('COREAO|GHCR|PUSH_VERIFIED_BY_DOCKER_CLI|IMAGE='+$image+'|DIGEST='+$digestMatch.Groups[1].Value+'|RELEASE=HOLD')
          & docker logout ghcr.io | Out-Null
      - name: Publish separate immutable evidence tag to Docker Hub
        shell: pwsh
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          $ErrorActionPreference='Stop'
          if($env:DOCKERHUB_USERNAME -cne 'paulcheek' -or
             [string]::IsNullOrWhiteSpace($env:DOCKERHUB_TOKEN)){
            throw 'COREAO|DOCKERHUB|HOLD|expected_owner_or_token_unavailable'
          }
          $ghcr='ghcr.io/simply-well-executed/pentagonal-xor-cpp20-coreao-evidence:sha-'+$env:GITHUB_SHA
          $hub='paulcheek/openbsd2-coreao-evidence:sha-'+$env:GITHUB_SHA
          & docker tag $ghcr $hub
          if($LASTEXITCODE -ne 0){throw 'COREAO|DOCKERHUB|HOLD|tag_failed'}
          $env:DOCKERHUB_TOKEN | docker login --username $env:DOCKERHUB_USERNAME --password-stdin
          if($LASTEXITCODE -ne 0){throw 'COREAO|DOCKERHUB|HOLD|login_failed'}
          $output=@(& docker push $hub 2>&1)
          foreach($line in $output){Write-Host $line}
          if($LASTEXITCODE -ne 0){throw 'COREAO|DOCKERHUB|HOLD|push_failed'}
          $digestMatch=[regex]::Match(($output -join [char]10),'digest: (sha256:[0-9a-f]{64})')
          if(-not $digestMatch.Success){throw 'COREAO|DOCKERHUB|HOLD|remote_digest_not_reported'}
          Write-Host ('COREAO|DOCKERHUB|PUSH_VERIFIED_BY_DOCKER_CLI|IMAGE='+$hub+'|DIGEST='+$digestMatch.Groups[1].Value+'|RELEASE=HOLD')
          & docker logout | Out-Null
      - name: Preserve OpenBSD native-build and GNU policy HOLD
        if: always()
        shell: pwsh
        run: |
          Write-Host 'COREAO|CUSTODY|CORE=OPENBSD2|YIN_YANG_SEPARATE|NATIVE_OPENBSD_BUILDS=0|RELEASE=HOLD'
          Write-Host 'COREAO|CUSTODY|CONTAINER_IS_LINUX_AMD64_EVIDENCE_ONLY|NO_MERGE|NO_LATEST_TAG'
          Write-Host 'COREAO|CUSTODY|EXISTING_GNU_POSIX_RELEASE_HOLD_UNCHANGED'
