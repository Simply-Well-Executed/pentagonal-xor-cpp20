name: REELNATIVE stage 09 OpenBSD2 YANG immutable OCI and openbsd1 pointers
# SPDX-License-Identifier: 0BSD
# This publishes stage-09 YANG Linux/amd64 witness only, NOT an OpenBSD binary.
# One explicit publish(reelnative): commit, no merge or mutable latest tag.
on:
  push:
    branches:
      - feat/fresh-artistic-eye-chain-20261120
    paths:
      - .github/workflows/reelnative-yang-openbsd1-pinned-once.yml
permissions:
  contents: read
  packages: write
concurrency:
  group: reelnative-yang-openbsd1-exactly-pinned-once
  cancel-in-progress: false
jobs:
  build-validate-publish:
    if: >-
      github.repository == 'Simply-Well-Executed/pentagonal-xor-cpp20' &&
      github.ref == 'refs/heads/feat/fresh-artistic-eye-chain-20261120' &&
      startsWith(github.event.head_commit.message, 'publish(reelnative):')
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
    steps:
      - name: Recover exact GitHub commit source without Node actions
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference='Stop'
          if($env:GITHUB_ACTIONS -cne 'true' -or
             $env:GITHUB_REPOSITORY -cne 'Simply-Well-Executed/pentagonal-xor-cpp20' -or
             $env:RUNNER_ENVIRONMENT -cne 'github-hosted' -or
             $env:GITHUB_SHA -cnotmatch '^[0-9a-f]{40}$'){
            throw 'REELNATIVE|OCI|HOLD|invalid_host_or_source_revision'
          }
          $zip=Join-Path $env:RUNNER_TEMP 'reelnative-oci-source.zip'
          $dest=Join-Path $env:RUNNER_TEMP 'reelnative-oci-source'
          $uri='https://api.github.com/repos/'+$env:GITHUB_REPOSITORY+'/zipball/'+$env:GITHUB_SHA
          Invoke-WebRequest -Uri $uri -Headers @{Authorization=('Bearer '+$env:GH_TOKEN);
             Accept='application/vnd.github+json';
             'X-GitHub-Api-Version'='2022-11-28';
             'User-Agent'='swe-coreao-evidence'} -OutFile $zip -MaximumRedirection 5
          Expand-Archive -LiteralPath $zip -DestinationPath $dest
          $dirs=@(Get-ChildItem -LiteralPath $dest -Directory)
          if($dirs.Count -ne 1 -or
             -not [IO.File]::Exists((Join-Path $dirs[0].FullName 'ci/Invoke-OpenBSDSerialCoreao.ps1'))){
            throw 'REELNATIVE|OCI|HOLD|bad_source_archive'
          }
          [IO.File]::WriteAllText((Join-Path $env:RUNNER_TEMP 'reelnative-oci-root.txt'),$dirs[0].FullName)
      - name: Execute stage 09 YANG, compile freestanding C++20 O2, Docker HEAD and TAIL
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $root=[IO.File]::ReadAllText((Join-Path $env:RUNNER_TEMP 'reelnative-oci-root.txt'))
          $image='ghcr.io/simply-well-executed/reelnative-yang-evidence:sha-'+$env:GITHUB_SHA
          & pwsh -NoLogo -NoProfile -File (Join-Path $root 'ci/Build-ReelnativeYangEvidenceOci.ps1') -RepositoryRoot $root -WorkingDirectory (Join-Path $env:RUNNER_TEMP 'reelnative-oci-build') -ImageTag $image
          if($LASTEXITCODE -ne 0){throw 'REELNATIVE|OCI|HOLD|build_or_runtime_test_failed'}
      - name: Publish immutable evidence package to GHCR
        shell: pwsh
        env:
          GHCR_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference='Stop'
          if([string]::IsNullOrWhiteSpace($env:GHCR_TOKEN)){throw 'REELNATIVE|GHCR|HOLD|token_missing'}
          $image='ghcr.io/simply-well-executed/reelnative-yang-evidence:sha-'+$env:GITHUB_SHA
          $env:GHCR_TOKEN | docker login ghcr.io --username $env:GITHUB_ACTOR --password-stdin
          if($LASTEXITCODE -ne 0){throw 'REELNATIVE|GHCR|HOLD|login_failed'}
          $output=@(& docker push $image 2>&1)
          foreach($line in $output){Write-Host $line}
          if($LASTEXITCODE -ne 0){throw 'REELNATIVE|GHCR|HOLD|push_failed'}
          $digestMatch=[regex]::Match(($output -join [char]10),'digest: (sha256:[0-9a-f]{64})')
          if(-not $digestMatch.Success){throw 'REELNATIVE|GHCR|HOLD|remote_digest_not_reported'}
          Write-Host ('REELNATIVE|GHCR|PUSH_VERIFIED_BY_DOCKER_CLI|IMAGE='+$image+'|DIGEST='+$digestMatch.Groups[1].Value+'|RELEASE=HOLD')
          [IO.File]::WriteAllText((Join-Path $env:RUNNER_TEMP 'reelnative-ghcr-digest.txt'),$digestMatch.Groups[1].Value)
          & docker logout ghcr.io | Out-Null
      - name: Mirror exact pinned GHCR manifest to short openbsd1 package
        shell: pwsh
        env:
          GHCR_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference='Stop'
          $source='ghcr.io/simply-well-executed/reelnative-yang-evidence:sha-'+$env:GITHUB_SHA
          $alias='ghcr.io/simply-well-executed/openbsd1:sha-'+$env:GITHUB_SHA
          $expectedDigest=[IO.File]::ReadAllText((Join-Path $env:RUNNER_TEMP 'reelnative-ghcr-digest.txt')).Trim()
          $env:GHCR_TOKEN | docker login ghcr.io --username $env:GITHUB_ACTOR --password-stdin
          if($LASTEXITCODE -ne 0){throw 'REELNATIVE|GHCR_ALIAS|HOLD|login_failed'}
          & docker tag $source $alias
          if($LASTEXITCODE -ne 0){throw 'REELNATIVE|GHCR_ALIAS|HOLD|source_image_missing'}
          $output=@(& docker push $alias 2>&1)
          foreach($line in $output){Write-Host $line}
          if($LASTEXITCODE -ne 0){throw 'REELNATIVE|GHCR_ALIAS|HOLD|push_failed'}
          $m=[regex]::Match(($output -join [char]10),'digest: (sha256:[0-9a-f]{64})')
          if(-not $m.Success -or $m.Groups[1].Value -cne $expectedDigest){
            throw 'REELNATIVE|GHCR_ALIAS|HOLD|alias_digest_mismatch'
          }
          Write-Host ('REELNATIVE|GHCR_ALIAS|PIN_MATCH|IMAGE='+$alias+'|DIGEST='+$expectedDigest+'|STAGE=09|CORE=OPENBSD2')
          & docker logout ghcr.io | Out-Null
      - name: Publish separate immutable evidence tag to Docker Hub
        shell: pwsh
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          $ErrorActionPreference='Stop'
          if($env:DOCKERHUB_USERNAME -cne 'paulcheek' -or
             [string]::IsNullOrWhiteSpace($env:DOCKERHUB_TOKEN)){
            throw 'REELNATIVE|DOCKERHUB|HOLD|expected_owner_or_token_unavailable'
          }
          $ghcr='ghcr.io/simply-well-executed/reelnative-yang-evidence:sha-'+$env:GITHUB_SHA
          $hub='paulcheek/reelnative-yang-evidence:sha-'+$env:GITHUB_SHA
          & docker tag $ghcr $hub
          if($LASTEXITCODE -ne 0){throw 'REELNATIVE|DOCKERHUB|HOLD|tag_failed'}
          $env:DOCKERHUB_TOKEN | docker login --username $env:DOCKERHUB_USERNAME --password-stdin
          if($LASTEXITCODE -ne 0){throw 'REELNATIVE|DOCKERHUB|HOLD|login_failed'}
          $output=@(& docker push $hub 2>&1)
          foreach($line in $output){Write-Host $line}
          if($LASTEXITCODE -ne 0){throw 'REELNATIVE|DOCKERHUB|HOLD|push_failed'}
          $digestMatch=[regex]::Match(($output -join [char]10),'digest: (sha256:[0-9a-f]{64})')
          if(-not $digestMatch.Success){throw 'REELNATIVE|DOCKERHUB|HOLD|remote_digest_not_reported'}
          $expectedDigest=[IO.File]::ReadAllText((Join-Path $env:RUNNER_TEMP 'reelnative-ghcr-digest.txt')).Trim()
          if($digestMatch.Groups[1].Value -cne $expectedDigest){throw 'REELNATIVE|DOCKERHUB|HOLD|wrong_source_manifest_digest'}
          [IO.File]::WriteAllText((Join-Path $env:RUNNER_TEMP 'reelnative-hub-digest.txt'),$digestMatch.Groups[1].Value)
          Write-Host ('REELNATIVE|DOCKERHUB|PUSH_VERIFIED_BY_DOCKER_CLI|IMAGE='+$hub+'|DIGEST='+$digestMatch.Groups[1].Value+'|RELEASE=HOLD')
          & docker logout | Out-Null
      - name: Mirror exact pinned Docker Hub manifest to short openbsd1 package
        shell: pwsh
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          $ErrorActionPreference='Stop'
          if($env:DOCKERHUB_USERNAME -cne 'paulcheek' -or
             [string]::IsNullOrWhiteSpace($env:DOCKERHUB_TOKEN)){
            throw 'REELNATIVE|DOCKERHUB_ALIAS|HOLD|owner_or_token_missing'
          }
          $source='paulcheek/reelnative-yang-evidence:sha-'+$env:GITHUB_SHA
          $alias='paulcheek/openbsd1:sha-'+$env:GITHUB_SHA
          $expectedDigest=[IO.File]::ReadAllText((Join-Path $env:RUNNER_TEMP 'reelnative-hub-digest.txt')).Trim()
          $env:DOCKERHUB_TOKEN | docker login --username $env:DOCKERHUB_USERNAME --password-stdin
          if($LASTEXITCODE -ne 0){throw 'REELNATIVE|DOCKERHUB_ALIAS|HOLD|login_failed'}
          & docker tag $source $alias
          if($LASTEXITCODE -ne 0){throw 'REELNATIVE|DOCKERHUB_ALIAS|HOLD|source_image_missing'}
          $output=@(& docker push $alias 2>&1)
          foreach($line in $output){Write-Host $line}
          if($LASTEXITCODE -ne 0){throw 'REELNATIVE|DOCKERHUB_ALIAS|HOLD|push_failed'}
          $m=[regex]::Match(($output -join [char]10),'digest: (sha256:[0-9a-f]{64})')
          if(-not $m.Success -or $m.Groups[1].Value -cne $expectedDigest){
            throw 'REELNATIVE|DOCKERHUB_ALIAS|HOLD|alias_digest_mismatch'
          }
          Write-Host ('REELNATIVE|DOCKERHUB_ALIAS|PIN_MATCH|IMAGE='+$alias+'|DIGEST='+$expectedDigest+'|STAGE=09|CORE=OPENBSD2')
          & docker logout | Out-Null
      - name: Preserve OpenBSD native-build and GNU policy HOLD
        if: always()
        shell: pwsh
        run: |
          Write-Host 'REELNATIVE|CUSTODY|STAGE=09|CORE=OPENBSD2|YIN_YANG_SEPARATE|NATIVE_OPENBSD_BUILDS=0|RELEASE=HOLD'
          Write-Host 'REELNATIVE|CUSTODY|LINUX_AMD64_STAGE09_YANG_ONLY|CORE=OPENBSD2|NO_MERGE|NO_LATEST_TAG'
          Write-Host 'REELNATIVE|CUSTODY|EXISTING_GNU_POSIX_RELEASE_HOLD_UNCHANGED'
