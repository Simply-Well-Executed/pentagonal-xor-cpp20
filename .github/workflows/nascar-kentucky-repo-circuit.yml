# SPDX-License-Identifier: 0BSD
# NASCAR = serial source and subproject qualifications; Kentucky = full repository.
name: NASCAR / Kentucky Derby | joint stacked repository circuit
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: repo-circuit-${{ github.ref }}
  cancel-in-progress: false
jobs:
  stack-circuit:
    name: FILE -> SUBPROJECT -> REPOSITORY (single native runner)
    runs-on: windows-2025
    timeout-minutes: 180
    permissions:
      contents: read
    env:
      MSBUILDDISABLENODEREUSE: '1'
      DOTNET_CLI_DO_NOT_USE_MSBUILD_SERVER: '1'
    steps:
      - name: Bootstrap exact merge/source SHA with PowerShell only
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          Set-StrictMode -Version 2.0
          $ErrorActionPreference='Stop'
          if($env:GITHUB_ACTIONS -cne 'true' -or
             $env:RUNNER_OS -cne 'Windows' -or
             $env:GITHUB_REPOSITORY -cne 'Simply-Well-Executed/pentagonal-xor-cpp20' -or
             $env:GITHUB_SHA -cnotmatch '^[0-9a-f]{40}$'){
            throw 'REPO_CIRCUIT|HOLD|invalid_source_runner'
          }
          $zip=Join-Path $env:RUNNER_TEMP 'race-exact-source.zip'
          $destination=Join-Path $env:RUNNER_TEMP 'race-exact-source'
          $uri='https://api.github.com/repos/'+$env:GITHUB_REPOSITORY+'/zipball/'+$env:GITHUB_SHA
          Invoke-WebRequest -Uri $uri -Headers @{
            Authorization='Bearer '+$env:GH_TOKEN
            Accept='application/vnd.github+json'
            'X-GitHub-Api-Version'='2022-11-28'
            'User-Agent'='swe-nascar-derby-circuit'
          } -OutFile $zip -MaximumRedirection 5
          Expand-Archive -LiteralPath $zip -DestinationPath $destination
          $roots=@(Get-ChildItem -LiteralPath $destination -Directory)
          if($roots.Count -ne 1 -or
             -not [IO.File]::Exists((Join-Path $roots[0].FullName 'ci/Invoke-RepositoryCircuit.ps1'))){
            throw 'REPO_CIRCUIT|HOLD|incomplete_source'
          }
          [IO.File]::WriteAllText((Join-Path $env:RUNNER_TEMP 'race-root.txt'),$roots[0].FullName)
      - name: Run ordered file laps, subproject laps and whole-repo derby
        shell: pwsh
        run: |
          Set-StrictMode -Version 2.0
          $ErrorActionPreference='Stop'
          $root=[IO.File]::ReadAllText((Join-Path $env:RUNNER_TEMP 'race-root.txt'))
          & pwsh -NoLogo -NoProfile -NonInteractive -File (Join-Path $root 'ci/Invoke-RepositoryCircuit.ps1') -RepositoryRoot $root -EvidenceDirectory (Join-Path $env:RUNNER_TEMP 'race-evidence')
          if($LASTEXITCODE -ne 0){throw 'REPO_CIRCUIT|HOLD|lap_or_derby_failed'}
      - name: Never promote a CI pass into release approval
        if: always()
        shell: pwsh
        run: |
          Write-Host 'REPO_CIRCUIT|RELEASE=HOLD|HUMAN_APPROVAL=NOT_ASSUMED'
