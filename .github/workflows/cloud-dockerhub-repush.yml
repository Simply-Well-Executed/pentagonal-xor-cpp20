name: GitHub cloud Docker Hub same-digest re-push (authorized)

# Publication scope: ONLY re-push the already-published verified digest.
# Never promote unvalidated new source or replace latest with different bytes.
# Only an owner-controlled branch push triggers this workflow.
on:
  push:
    branches:
      - feat/cloud-dockerhub-repush-20261120

permissions:
  contents: read

concurrency:
  group: dockerhub-same-digest-repush
  cancel-in-progress: false

jobs:
  verify-and-repush:
    name: GitHub-hosted exact-manifest Docker Hub latest re-push
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    permissions:
      contents: read
    steps:
      - name: Verify hosted compute and Docker availability
        shell: bash
        run: |
          set -euo pipefail
          test "${GITHUB_ACTIONS:-}" = true
          test "${RUNNER_ENVIRONMENT:-}" = github-hosted
          test "$(uname -m)" = x86_64
          docker info
          docker buildx version
      - name: Obtain exact immutable workflow source without Node actions
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          src="$RUNNER_TEMP/approved-source"
          git init -q "$src"
          git -C "$src" remote add origin "https://github.com/$GITHUB_REPOSITORY.git"
          git -C "$src" -c credential.helper='!f() { printf "username=x-access-token\npassword=%s\n" "$GH_TOKEN"; }; f' fetch --no-tags --depth=1 origin "$GITHUB_SHA"
          git -C "$src" checkout --detach FETCH_HEAD
          test "$(git -C "$src" rev-parse HEAD)" = "$GITHUB_SHA"
          test -z "$(git -C "$src" status --porcelain --untracked-files=all)"
      - name: Live registry validation and authorized idempotent Docker push
        shell: bash
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          set -euo pipefail
          /bin/sh "$RUNNER_TEMP/approved-source/ci/Cloud-Repush-AndroidSourceStudy.sh"
      - name: Report release boundary
        if: always()
        shell: bash
        run: |
          echo 'No user-local compute was used.'
          echo 'This workflow only re-pushes an already matching Docker Hub manifest.'
          echo 'It does not authorize new image content, GAMP4 QA, PQ, or 13-profile releases.'
