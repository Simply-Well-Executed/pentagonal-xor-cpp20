# SPDX-License-Identifier: 0BSD
name: DIAERY XHTML Strict Native 1-to-1 Parity Gate
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'diaery/**'
      - 'shared/**'
      - '.github/workflows/diaery-parity.yml'
permissions:
  contents: read
concurrency:
  group: diaery-parity-${{ github.ref }}
  cancel-in-progress: false
jobs:
  diaery-concurrence:
    name: Native MSVC /O2 | XHTML Strict-profile 1:1 concurrence
    runs-on: windows-2025
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Bootstrap exact SHA source (PowerShell only, no Node actions)
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          Set-StrictMode -Version Latest
          $ErrorActionPreference='Stop'
          if($env:GITHUB_ACTIONS -cne 'true' -or
             $env:RUNNER_OS -cne 'Windows' -or
             $env:GITHUB_REPOSITORY -cne 'Simply-Well-Executed/pentagonal-xor-cpp20' -or
             $env:GITHUB_SHA -cnotmatch '^[0-9a-f]{40}$'){
            throw 'DIAERY|HOLD|untrusted_runner_or_sha'
          }
          $zip=Join-Path $env:RUNNER_TEMP 'diaery-exact-source.zip'
          $destination=Join-Path $env:RUNNER_TEMP 'diaery-exact-source'
          $uri='https://api.github.com/repos/'+$env:GITHUB_REPOSITORY+'/zipball/'+$env:GITHUB_SHA
          # Source bootstrap ONLY. All subsequent compilation/testing is offline.
          Invoke-WebRequest -Uri $uri -Headers @{
            Authorization='Bearer '+$env:GH_TOKEN
            Accept='application/vnd.github+json'
            'X-GitHub-Api-Version'='2022-11-28'
            'User-Agent'='swe-diaery-parity'
          } -OutFile $zip -MaximumRedirection 5
          Expand-Archive -LiteralPath $zip -DestinationPath $destination
          $roots=@(Get-ChildItem -LiteralPath $destination -Directory)
          if($roots.Count -ne 1 -or
             -not [IO.File]::Exists((Join-Path $roots[0].FullName 'diaery/diaery.cpp'))){
            throw 'DIAERY|HOLD|incomplete_exact_source'
          }
          [IO.File]::WriteAllText((Join-Path $env:RUNNER_TEMP 'diaery-root.txt'),$roots[0].FullName)
      - name: Concurrence | C++20 native compile, XHTML parity and negative tests
        shell: pwsh
        run: |
          Set-StrictMode -Version Latest
          $ErrorActionPreference='Stop'
          $root=[IO.File]::ReadAllText((Join-Path $env:RUNNER_TEMP 'diaery-root.txt'))
          & pwsh -NoLogo -NoProfile -NonInteractive -File `
            (Join-Path $root 'diaery/Invoke-ParityGate.ps1') `
            -RepositoryRoot $root `
            -EvidenceDirectory (Join-Path $env:RUNNER_TEMP 'diaery-evidence')
          if($LASTEXITCODE -ne 0){throw 'DIAERY|HOLD|native_concurrence_failed'}
      - name: FUSION | native XHTML to C++20 reverse FIFO/LAFIT qualification
        shell: pwsh
        run: |
          Set-StrictMode -Version Latest
          $ErrorActionPreference='Stop'
          $root=[IO.File]::ReadAllText((Join-Path $env:RUNNER_TEMP 'diaery-root.txt'))
          & pwsh -NoLogo -NoProfile -NonInteractive -File `
            (Join-Path $root 'diaery/Invoke-FusionQualification.ps1') `
            -RepositoryRoot $root `
            -EvidenceDirectory (Join-Path $env:RUNNER_TEMP 'diaery-evidence')
          if($LASTEXITCODE -ne 0){throw 'DIAERY|HOLD|FUSION_QUALIFICATION_FAILED'}
      - name: Finite NASCAR | C++20 SlidingToolong and independent exact oracle
        shell: pwsh
        run: |
          Set-StrictMode -Version Latest
          $ErrorActionPreference='Stop'
          $root=[IO.File]::ReadAllText((Join-Path $env:RUNNER_TEMP 'diaery-root.txt'))
          & pwsh -NoLogo -NoProfile -NonInteractive -File `
            (Join-Path $root 'diaery/Invoke-FiniteQualification.ps1') `
            -RepositoryRoot $root `
            -EvidenceDirectory (Join-Path $env:RUNNER_TEMP 'diaery-evidence')
          if($LASTEXITCODE -ne 0){throw 'NASCAR|HOLD|finite_oracle_failed'}
      - name: Unbound NASCAR | native expanding limbs and independent oracle
        shell: pwsh
        run: |
          Set-StrictMode -Version Latest
          $ErrorActionPreference='Stop'
          $root=[IO.File]::ReadAllText((Join-Path $env:RUNNER_TEMP 'diaery-root.txt'))
          & pwsh -NoLogo -NoProfile -NonInteractive -File `
            (Join-Path $root 'diaery/Invoke-UnboundQualification.ps1') `
            -RepositoryRoot $root `
            -EvidenceDirectory (Join-Path $env:RUNNER_TEMP 'diaery-evidence')
          if($LASTEXITCODE -ne 0){throw 'UNBOUND|HOLD|independent_oracle_failed'}
      - name: Tri-flavors | C++20 versus XHTML, Oracle Java status explicit
        shell: pwsh
        run: |
          Set-StrictMode -Version Latest
          $ErrorActionPreference='Stop'
          $root=[IO.File]::ReadAllText((Join-Path $env:RUNNER_TEMP 'diaery-root.txt'))
          & pwsh -NoLogo -NoProfile -NonInteractive -File `
            (Join-Path $root 'diaery/Invoke-TriFlavorQualification.ps1') `
            -RepositoryRoot $root `
            -EvidenceDirectory (Join-Path $env:RUNNER_TEMP 'diaery-evidence')
          if($LASTEXITCODE -ne 0){throw 'TRIFLAVOR|HOLD|CPP_XHTML_qualification_failed'}
      - name: Preserve separate human authorization and release HOLD
        if: always()
        shell: pwsh
        run: |
          Write-Host 'DIAERY|RELEASE=HOLD|CI_SUCCESS_IS_NOT_HUMAN_APPROVAL'
          Write-Host 'DIAERY|NO_INCEPTION_GATE_BYPASS|NO_PUBLICATION_AUTHORIZATION'
