# SPDX-License-Identifier: 0BSD
# EXCITED v2: native C++20 A* after EXCITE success, no standard C++ headers,
# Python, JSON, Bash, Ubuntu, Node checkout or Node artifact upload.
name: EXCITED | Sovieta Diao Xian ^.^ A-star x SPT Finland v2
on:
  workflow_call:
    inputs:
      source_sha:
        description: Exact already-qualified EXCITE source revision
        required: true
        type: string
permissions:
  contents: read
jobs:
  excited-a-star:
    name: Native C++20 A* and SPT cross-verified Markdown
    runs-on: windows-2025
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Bootstrap pinned qualified source (PowerShell only)
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ inputs.source_sha }}
        run: |
          Set-StrictMode -Version 2.0
          $ErrorActionPreference='Stop'
          if($env:GITHUB_ACTIONS -cne 'true' -or
             $env:RUNNER_OS -cne 'Windows' -or
             $env:GITHUB_REPOSITORY -cne 'Simply-Well-Executed/pentagonal-xor-cpp20' -or
             $env:SOURCE_SHA -cnotmatch '^[a-f0-9]{40}$' -or
             $env:SOURCE_SHA -cne $env:GITHUB_SHA){
            throw 'EXCITED|HOLD|revision_or_runner_mismatch'
          }
          $uri='https://api.github.com/repos/'+$env:GITHUB_REPOSITORY+'/zipball/'+$env:SOURCE_SHA
          $zip=Join-Path $env:RUNNER_TEMP 'excited-exact-source.zip'
          $stage=Join-Path $env:RUNNER_TEMP 'excited-exact-source'
          Invoke-WebRequest -Uri $uri -Headers @{
            Authorization='Bearer '+$env:GH_TOKEN
            Accept='application/vnd.github+json'
            'X-GitHub-Api-Version'='2022-11-28'
            'User-Agent'='swe-excited-a-star'
          } -OutFile $zip -MaximumRedirection 5
          Expand-Archive -LiteralPath $zip -DestinationPath $stage
          $roots=@(Get-ChildItem -LiteralPath $stage -Directory)
          if($roots.Count -ne 1 -or
             -not [IO.File]::Exists((Join-Path $roots[0].FullName 'ci/Build-ExcitedMarkdown.ps1'))){
            throw 'EXCITED|HOLD|source_incomplete'
          }
          [IO.File]::WriteAllText((Join-Path $env:RUNNER_TEMP 'excited-root.txt'),$roots[0].FullName)
      - name: Compile ISO C++20 /O2 A* plus SPT Finland and generate Markdown
        shell: pwsh
        env:
          SOURCE_SHA: ${{ inputs.source_sha }}
        run: |
          Set-StrictMode -Version 2.0
          $ErrorActionPreference='Stop'
          $root=[IO.File]::ReadAllText((Join-Path $env:RUNNER_TEMP 'excited-root.txt'))
          & pwsh -NoLogo -NoProfile -NonInteractive -File (Join-Path $root 'ci/Build-ExcitedMarkdown.ps1') `
            -RepositoryRoot $root `
            -OutputDirectory (Join-Path $env:RUNNER_TEMP 'excited-docs') `
            -SourceSha $env:SOURCE_SHA
          if($LASTEXITCODE -ne 0){throw 'EXCITED|HOLD|A_star_markdown_failed'}
      - name: Verify Markdown and immutable TSV receipt without Node upload
        shell: pwsh
        env:
          SOURCE_SHA: ${{ inputs.source_sha }}
        run: |
          Set-StrictMode -Version 2.0
          $ErrorActionPreference='Stop'
          $folder=Join-Path $env:RUNNER_TEMP 'excited-docs'
          $doc=Join-Path $folder 'sovieta-diao-xian-excited.md'
          $receipt=Join-Path $folder 'excited-receipt.tsv'
          if(-not [IO.File]::Exists($doc) -or -not [IO.File]::Exists($receipt)){
            throw 'EXCITED|HOLD|markdown_or_TSV_receipt_absent'
          }
          $fields=[Collections.Generic.Dictionary[string,string]]::new([StringComparer]::Ordinal)
          foreach($line in [IO.File]::ReadAllLines($receipt,[Text.Encoding]::UTF8)){
            $pair=$line.Split([char]9)
            if($pair.Count -ne 2 -or -not $fields.TryAdd($pair[0],$pair[1])){
              throw 'EXCITED|HOLD|invalid_or_duplicate_receipt_field'
            }
          }
          $sha=(Get-FileHash -LiteralPath $doc -Algorithm SHA256).Hash.ToLowerInvariant()
          if($fields['schema'] -cne 'EXCITED-STAR-002' -or
             $fields['source_sha'] -cne $env:SOURCE_SHA -or
             $fields['markdown_sha256'] -cne $sha -or
             $fields['route'] -cne 'Overview>Security>Summary' -or
             $fields['path_cost'] -cne '6' -or
             $fields['spt_protocol'] -cne 'SHORTEST_PATH_TREE_NOT_ETHERNET_STP' -or
             $fields['spt_verified'] -cne 'YES' -or
             $fields['spt_vertex_costs'] -cne '0,2,4,5,6' -or
             $fields['spt_parent_nodes'] -cne '-1,0,0,1,2' -or
             $fields['compiler'] -cne 'MSVC_CXX20_O2' -or
             $fields['no_std_in_source'] -cne 'YES' -or
             $fields['no_json'] -cne 'YES' -or
             $fields['release'] -cne 'HOLD'){
            throw 'EXCITED|HOLD|TSV_receipt_mismatch'
          }
          Write-Host ('EXCITED|V2|SPT_VERIFIED|MARKDOWN_SHA256='+$sha+'|RELEASE=HOLD')
      - name: No automatic API exposure or repository writes
        if: always()
        shell: pwsh
        run: |
          Write-Host 'EXCITED|API=LOOPBACK_OPT_IN_ONLY|NO_PUBLIC_SERVER|RELEASE=HOLD'
