name: PENTAGONAL TEST TILT VALIDATE RUN 60s
on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pentagonal-ttvr-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pondaz:
    name: 'Pondaz · preflight before all job lanes'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: 'Checkout exact source SHA using PowerShell Core'
        shell: pwsh
        run: |
          Set-StrictMode -Version 2.0
          $ErrorActionPreference = 'Stop'
          if ($env:GITHUB_REPOSITORY -cne 'Simply-Well-Executed/pentagonal-xor-cpp20') { throw 'Unexpected repository' }
          & git init .
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & git remote add origin 'https://github.com/Simply-Well-Executed/pentagonal-xor-cpp20.git'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & git -c advice.detachedHead=false fetch --no-tags --depth 1 origin $env:GITHUB_REF
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & git -c advice.detachedHead=false checkout --detach FETCH_HEAD
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $actual = (& git rev-parse HEAD).Trim()
          if ($LASTEXITCODE -ne 0 -or $actual -cne $env:GITHUB_SHA) { throw 'Pondaz source SHA mismatch' }
      - name: 'Run Pondaz fixture and tracked-text/event input audit'
        shell: pwsh
        run: |
          Set-StrictMode -Version 2.0
          & ./ci/Invoke-Pondaz.ps1 -SelfTest
          if (-not $?) { throw 'Pondaz fixture suite failed' }
          & ./ci/Invoke-Pondaz.ps1 -RepositoryRoot . -EventPath $env:GITHUB_EVENT_PATH -EvidenceDir pondaz-evidence
          if (-not $?) { throw 'Pondaz rejected untrusted input' }

  pentagonal-ttvr:
    needs: pondaz
    name: TEST to TILT(error) to VALIDATE to RUN(60s)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Source checkout at exact SHA, preserving pinned submodules
        run: |
          $ErrorActionPreference='Stop'
          & git init .
          if ($LASTEXITCODE -ne 0) { throw 'git init failed' }
          & git remote add origin "https://github.com/$env:GITHUB_REPOSITORY.git"
          if ($LASTEXITCODE -ne 0) { throw 'git remote failed' }
          & git fetch --no-tags --depth 1 origin $env:GITHUB_SHA
          if ($LASTEXITCODE -ne 0) { throw 'git fetch failed' }
          & git checkout --detach FETCH_HEAD
          if ($LASTEXITCODE -ne 0) { throw 'git checkout failed' }
          $sha=((& git rev-parse HEAD)|Out-String).Trim()
          if ($sha -cne $env:GITHUB_SHA) { throw 'Checked out different source commit' }
          & git -c protocol.file.allow=never submodule update --init --recursive
          if ($LASTEXITCODE -ne 0) { throw 'Pinned submodule fetch failed' }
          Write-Host "PENTAGONAL|SOURCE|$sha"
      - name: TEST - native C++20 CTest and Java 17 reference
        run: |
          & ./ci/Invoke-PentagonalTTVR.ps1 -Phase TEST -Validator pentagonal_gamp4_validation_test
          if (!$?) { exit 1 }
      - name: TILT with error - detect intentional one-bit ligand rupture
        run: |
          & ./ci/Invoke-PentagonalTTVR.ps1 -Phase TILT -Validator pentagonal_gamp4_validation_test
          if (!$?) { exit 1 }
      - name: VALIDATE - 12 GAMP 4-style URS, SHA-256 and source custody
        run: |
          & ./ci/Invoke-PentagonalTTVR.ps1 -Phase VALIDATE -Validator pentagonal_gamp4_validation_test
          if (!$?) { exit 1 }
      - name: RUN - sixty seconds of active Java six-stage execution
        run: |
          & ./ci/Invoke-PentagonalTTVR.ps1 -Phase RUN -Validator pentagonal_gamp4_validation_test
          if (!$?) { exit 1 }
      - name: Retain pass or failure evidence in job log
        if: always()
        run: |
          if (Test-Path -LiteralPath evidence-ttvr) {
            foreach ($file in @(Get-ChildItem -LiteralPath evidence-ttvr -File | Sort-Object Name)) {
              $digest=(Get-FileHash -LiteralPath $file.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
              Write-Host "PENTAGONAL|EVIDENCE|$digest|$($file.Name)"
            }
            if (Test-Path -LiteralPath evidence-ttvr/run.json) {
              Get-Content -LiteralPath evidence-ttvr/run.json
            }
          } else {
            Write-Host 'PENTAGONAL|EVIDENCE|NOT_CREATED'
          }
