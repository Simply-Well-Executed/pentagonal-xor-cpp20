name: '🚀 Build · Test · Ship'

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ship-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  pondaz:
    name: 'Pondaz · preflight before all job lanes'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: 'Checkout exact source SHA using PowerShell Core'
        shell: pwsh
        run: |
          Set-StrictMode -Version 2.0
          $ErrorActionPreference = 'Stop'
          if ($env:GITHUB_REPOSITORY -cne 'Simply-Well-Executed/pentagonal-xor-cpp20') { throw 'Unexpected repository' }
          & git init .
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & git remote add origin 'https://github.com/Simply-Well-Executed/pentagonal-xor-cpp20.git'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & git -c advice.detachedHead=false fetch --no-tags --depth 1 origin $env:GITHUB_REF
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & git -c advice.detachedHead=false checkout --detach FETCH_HEAD
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $actual = (& git rev-parse HEAD).Trim()
          if ($LASTEXITCODE -ne 0 -or $actual -cne $env:GITHUB_SHA) { throw 'Pondaz source SHA mismatch' }
      - name: 'Run Pondaz fixture and tracked-text/event input audit'
        shell: pwsh
        run: |
          Set-StrictMode -Version 2.0
          & ./ci/Invoke-Pondaz.ps1 -SelfTest
          if (-not $?) { throw 'Pondaz fixture suite failed' }
          & ./ci/Invoke-Pondaz.ps1 -RepositoryRoot . -EventPath $env:GITHUB_EVENT_PATH -EvidenceDir pondaz-evidence
          if (-not $?) { throw 'Pondaz rejected untrusted input' }

  build:
    needs: pondaz
    name: '${{ matrix.name }}'
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 25
    continue-on-error: ${{ matrix.experimental }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - {name: 'Linux x64', runner: ubuntu-24.04, flavor: linux, arch: x64, vs_arch: '', experimental: false}
          - {name: 'Linux ARM64', runner: ubuntu-24.04-arm, flavor: linux, arch: arm64, vs_arch: '', experimental: false}
          - {name: 'Windows x64', runner: windows-2022, flavor: windows, arch: x64, vs_arch: x64, experimental: false}
          - {name: 'Windows x86', runner: windows-2022, flavor: windows, arch: x86, vs_arch: Win32, experimental: false}
          - {name: 'Windows ARM64 (experimental)', runner: windows-11-arm, flavor: windows, arch: arm64, vs_arch: ARM64, experimental: true}
          - {name: 'macOS Intel', runner: macos-15-intel, flavor: macos, arch: x64, vs_arch: '', experimental: false}
          - {name: 'macOS Apple Silicon', runner: macos-15, flavor: macos, arch: arm64, vs_arch: '', experimental: false}

    steps:
      - name: '📥 Check out source'
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: '🔎 Release pre-flight: reject paused/debug code'
        shell: pwsh
        run: ./ci/Test-ReleaseSafety.ps1

      - name: '📁 Prepare evidence folder before compilation'
        shell: pwsh
        run: New-Item -ItemType Directory -Force -Path evidence | Out-Null

      - name: '⚙️ Configure on Windows'
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          & cmake -S . -B build -A ${{ matrix.vs_arch }} -DBUILD_TESTING=ON *>&1 | Tee-Object -FilePath evidence/configure.log
          exit $LASTEXITCODE

      - name: '⚙️ Configure on Unix'
        if: runner.os != 'Windows'
        shell: pwsh
        run: |
          & cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=ON *>&1 | Tee-Object -FilePath evidence/configure.log
          exit $LASTEXITCODE

      - name: '🔨 Compile C++20'
        id: compile
        shell: pwsh
        run: |
          & cmake --build build --config Release --parallel *>&1 | Tee-Object -FilePath evidence/build.log
          exit $LASTEXITCODE

      - name: '🧪 Run CTest parity suite'
        id: test
        shell: pwsh
        run: |
          & ctest --test-dir build -C Release --output-on-failure --output-junit evidence/ctest-results.xml *>&1 | Tee-Object -FilePath evidence/test.log
          exit $LASTEXITCODE

      - name: '🔬 GAMP 4-style Pentagonal supplier validation and SHA-256 evidence'
        shell: pwsh
        run: |
          ./ci/Invoke-PentagonalGamp4.ps1 -BuildDir build -EvidenceDir evidence -ExecutableName pentagonal_gamp4_validation_test
          if (!$?) { exit 1 }

      - name: '📦 Stage install'
        run: cmake --install build --config Release --prefix stage

      - name: '🔎 Compile and run downstream consumer against installed audit headers'
        shell: pwsh
        env:
          TARGET_ARCH: ${{ matrix.vs_arch }}
        run: |
          ./ci/Test-InstalledAudit.ps1 -Stage stage -BuildDir build-consumer -VsArch "$env:TARGET_ARCH"

      - name: '📦 Package tar.gz'
        if: runner.os != 'Windows'
        shell: bash
        env:
          ASSET: pentagonal-xor-${{ matrix.flavor }}-${{ matrix.arch }}.tar.gz
        run: |
          mkdir -p dist
          tar -C stage -czf "dist/$ASSET" .

      - name: '📦 Package Windows zip'
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          ASSET: pentagonal-xor-${{ matrix.flavor }}-${{ matrix.arch }}.zip
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Compress-Archive -Path (Join-Path stage '*') -DestinationPath (Join-Path dist $env:ASSET) -Force

      - name: '⬆️ Upload CI artifact'
        uses: actions/upload-artifact@v7
        with:
          name: release-${{ matrix.flavor }}-${{ matrix.arch }}
          path: dist/*
          if-no-files-found: error
          retention-days: 14

      - name: '🧾 Preserve compiler identity, PDBs, partial outputs, logs and SHA-256'
        if: ${{ !cancelled() }}
        shell: pwsh
        env:
          BUILD_OUTCOME: ${{ steps.compile.outcome }}
          TEST_OUTCOME: ${{ steps.test.outcome }}
          TARGET_ARCH: ${{ matrix.vs_arch }}
        run: |
          ./ci/Write-CiEvidence.ps1 -BuildDir build -EvidenceDir evidence -BuildOutcome "$env:BUILD_OUTCOME" -TestOutcome "$env:TEST_OUTCOME" -TargetArch "$env:TARGET_ARCH"

      - name: '⬆️ Upload SHA-256 evidence even after a failed compile'
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: evidence-${{ matrix.flavor }}-${{ matrix.arch }}
          path: evidence/
          if-no-files-found: warn
          retention-days: 90


  android:
    needs: pondaz
    name: 'Android · offline Stability debug APK'
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: 'Checkout source with no persisted credentials'
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: 'Prepare Android evidence directory'
        shell: pwsh
        run: New-Item -ItemType Directory -Force -Path evidence-android | Out-Null

      - name: 'Validate release pre-flight'
        shell: pwsh
        run: ./ci/Test-ReleaseSafety.ps1

      - name: 'Install pinned JDK 17'
        uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: '17'

      # The runner provides SDK command-line tools; do not invoke the
      # obsolete Android SDK "tools" package used by older setup actions.
      - name: 'Use installed Android SDK manager'
        shell: pwsh
        run: |
          if ([string]::IsNullOrWhiteSpace($env:ANDROID_HOME)) { throw 'Missing ANDROID_HOME' }
          $path = Join-Path $env:ANDROID_HOME 'cmdline-tools/latest/bin'
          $sdk = Join-Path $path 'sdkmanager'
          if (!(Test-Path -LiteralPath $sdk -PathType Leaf)) { throw 'Missing SDK manager' }
          Add-Content -LiteralPath $env:GITHUB_PATH -Value $path
          & $sdk --version
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: 'Install pinned Android platform'
        shell: pwsh
        run: |
          & sdkmanager 'platforms;android-35' 'build-tools;35.0.0' *>&1 |
            Tee-Object -FilePath evidence-android/android-sdk.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: 'Gradle-free Android build: Java tests, javac, AAPT2, D8 and signed APK'
        id: compile
        shell: pwsh
        run: |
          ./ci/Build-Android.ps1 *>&1 | Tee-Object -FilePath evidence-android/build-and-test.log
          if (!$?) { exit 1 }

      - name: 'Rename APK explicitly as experimental debug build'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Copy-Item -LiteralPath android/app/build/outputs/apk/debug/app-debug.apk -Destination dist/pentagonal-xor-stability10d-android-debug.apk

      - name: 'Upload Android asset for release collection'
        uses: actions/upload-artifact@v7
        with:
          name: release-android-debug
          path: dist/pentagonal-xor-stability10d-android-debug.apk
          if-no-files-found: error
          retention-days: 14

      - name: 'Fingerprint APK and retain test/failure evidence'
        if: ${{ !cancelled() }}
        shell: pwsh
        run: ./ci/Write-AndroidEvidence.ps1 -EvidenceDir evidence-android

      - name: 'Upload Android evidence even after a failed build'
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: evidence-android-debug
          path: evidence-android/
          if-no-files-found: warn
          retention-days: 90

  release:
    needs: pondaz
    name: '🏷️ Publish checksummed GitHub release'
    needs: [build, android]
    if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: '⬇️ Collect platform archives'
        uses: actions/download-artifact@v8
        with:
          pattern: release-*
          path: dist
          merge-multiple: true

      - name: '🔐 Produce SHA-256 manifest for every platform including APK'
        shell: pwsh
        run: |
          $files = @(Get-ChildItem -LiteralPath dist -File | Sort-Object Name)
          if ($files.Count -lt 8) { throw 'Incomplete multi-platform package set.' }
          $rows = foreach ($file in $files) {
            $hash = (Get-FileHash -LiteralPath $file.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
            '{0}  {1}' -f $hash, $file.Name
          }
          $rows | Set-Content -LiteralPath dist/SHA256SUMS -Encoding utf8
          $rows

      - name: '🚀 Publish checksummed release with clearly labeled debug APK'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          $files = @(Get-ChildItem -LiteralPath dist -File | ForEach-Object FullName)
          if ($env:GITHUB_REF -like 'refs/tags/v*') {
            $tag = $env:GITHUB_REF.Substring(10)
            & gh release create $tag @files --title "⬟ Pentagonal XOR $tag" --target $env:GITHUB_SHA --generate-notes
          } else {
            $tag = "preview-$env:GITHUB_RUN_NUMBER-$($env:GITHUB_SHA.Substring(0,7))"
            & gh release create $tag @files --title "🧪 Preview $tag" --target $env:GITHUB_SHA --generate-notes --prerelease --latest=false
          }
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
