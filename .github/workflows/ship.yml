name: '🚀 Build · Test · Ship'

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ship-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: '${{ matrix.name }}'
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 25
    continue-on-error: ${{ matrix.experimental }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - {name: 'Linux x64', runner: ubuntu-24.04, flavor: linux, arch: x64, vs_arch: '', experimental: false}
          - {name: 'Linux ARM64', runner: ubuntu-24.04-arm, flavor: linux, arch: arm64, vs_arch: '', experimental: false}
          - {name: 'Windows x64', runner: windows-2022, flavor: windows, arch: x64, vs_arch: x64, experimental: false}
          - {name: 'Windows x86', runner: windows-2022, flavor: windows, arch: x86, vs_arch: Win32, experimental: false}
          - {name: 'Windows ARM64 (experimental)', runner: windows-11-arm, flavor: windows, arch: arm64, vs_arch: ARM64, experimental: true}
          - {name: 'macOS Intel', runner: macos-15-intel, flavor: macos, arch: x64, vs_arch: '', experimental: false}
          - {name: 'macOS Apple Silicon', runner: macos-15, flavor: macos, arch: arm64, vs_arch: '', experimental: false}

    steps:
      - name: '📥 Check out source'
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: '⚙️ Configure on Windows'
        if: runner.os == 'Windows'
        run: cmake -S . -B build -A ${{ matrix.vs_arch }} -DBUILD_TESTING=ON

      - name: '⚙️ Configure on Unix'
        if: runner.os != 'Windows'
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=ON

      - name: '🔨 Compile C++20'
        run: cmake --build build --config Release --parallel

      - name: '🧪 Run CTest parity suite'
        run: ctest --test-dir build -C Release --output-on-failure

      - name: '📦 Stage install'
        run: cmake --install build --config Release --prefix stage

      - name: '📦 Package tar.gz'
        if: runner.os != 'Windows'
        shell: bash
        env:
          ASSET: pentagonal-xor-${{ matrix.flavor }}-${{ matrix.arch }}.tar.gz
        run: |
          mkdir -p dist
          tar -C stage -czf "dist/$ASSET" .

      - name: '📦 Package Windows zip'
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          ASSET: pentagonal-xor-${{ matrix.flavor }}-${{ matrix.arch }}.zip
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Compress-Archive -Path (Join-Path stage '*') -DestinationPath (Join-Path dist $env:ASSET) -Force

      - name: '⬆️ Upload CI artifact'
        uses: actions/upload-artifact@v7
        with:
          name: release-${{ matrix.flavor }}-${{ matrix.arch }}
          path: dist/*
          if-no-files-found: error
          retention-days: 14

  release:
    name: '🏷️ Publish checksummed GitHub release'
    needs: [build]
    if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: '⬇️ Collect platform archives'
        uses: actions/download-artifact@v7
        with:
          pattern: release-*
          path: dist
          merge-multiple: true

      - name: '🔐 Produce SHA-256 manifest'
        shell: bash
        run: |
          set -euo pipefail
          cd dist
          sha256sum ./*.tar.gz ./*.zip > SHA256SUMS
          cat SHA256SUMS

      - name: '🚀 Publish releases'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            tag="${GITHUB_REF#refs/tags/}"
            title="⬟ Pentagonal XOR $tag"
            gh release create "$tag" dist/* --title "$title" --target "$GITHUB_SHA" --generate-notes
          else
            tag="preview-${GITHUB_RUN_NUMBER}-${GITHUB_SHA:0:7}"
            title="🧪 Preview $tag"
            gh release create "$tag" dist/* --title "$title" --target "$GITHUB_SHA" --generate-notes --prerelease --latest=false
          fi
