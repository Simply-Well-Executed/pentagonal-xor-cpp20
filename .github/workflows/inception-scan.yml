name: INCEPTION source scan

on:
  workflow_call:
    outputs:
      findings:
        description: Base64 JSON finding receipt
        value: ${{ jobs.scan.outputs.findings }}
      openbsd:
        description: Whether an OpenBSD preflight path changed
        value: ${{ jobs.scan.outputs.openbsd }}

jobs:
  scan:
    name: Evaluate INCEPTION-GATE policy
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read
    outputs:
      findings: ${{ steps.scan.outputs.findings }}
      openbsd: ${{ steps.scan.outputs.openbsd }}
    steps:
      - name: Inspect exact PR sources without executing them
        id: scan
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          Set-StrictMode -Version 2.0
          $ErrorActionPreference = 'Stop'
          if ($env:GITHUB_REPOSITORY -cne 'Simply-Well-Executed/pentagonal-xor-cpp20' -or
              $env:PR_NUMBER -notmatch '^[1-9][0-9]{0,8}$' -or
              @($env:BASE_SHA, $env:HEAD_SHA, $env:GITHUB_SHA).Where({ $_ -cnotmatch '^[0-9a-f]{40}$' }).Count) {
              throw 'INCEPTION-GATE: invalid repository or revision.'
          }
          $api = 'https://api.github.com/repos/' + $env:GITHUB_REPOSITORY
          $headers = @{ Authorization = 'Bearer ' + $env:GH_TOKEN; Accept = 'application/vnd.github+json'; 'X-GitHub-Api-Version' = '2022-11-28' }
          $prUrl = $api + '/pulls/' + $env:PR_NUMBER
          $utf8 = [Text.UTF8Encoding]::new($false, $true)

          function Get-SourceText([string]$Path) {
              $uri = $api + '/contents/' + $Path + '?ref=' + $env:GITHUB_SHA
              $response = Invoke-WebRequest -Uri $uri -Headers $headers -SkipHttpErrorCheck
              if ($response.StatusCode -eq 404) { return $null }
              if ($response.StatusCode -ne 200) { throw 'INCEPTION-GATE: source lookup failed.' }
              $entry = ConvertFrom-Json -InputObject $response.Content -AsHashtable
              if ($entry.type -cne 'file' -or $entry.encoding -cne 'base64') {
                  throw 'INCEPTION-GATE: source is not a readable file.'
              }
              $utf8.GetString([Convert]::FromBase64String($entry.content))
          }

          function Finding([string]$Rule, [string]$Path, [int]$Line = 1) {
              [pscustomobject]@{ rule = $Rule; path = $Path; line = $Line }
          }

          function Find-PowerShellIssues([string]$Path) {
              if ($Path -cnotmatch '^[A-Za-z0-9_./-]{1,240}$' -or $Path.StartsWith('/') -or
                  ($Path.Split('/') | Where-Object { $_ -in @('', '.', '..') })) {
                  Finding 'source-path' '[unsupported path]'
                  return
              }
              try { $source = Get-SourceText $Path }
              catch [Text.DecoderFallbackException] {
                  Finding 'invalid-utf8' $Path
                  return
              }
              if ($null -eq $source) { Finding 'source-path' $Path; return }
              $tokens = $null
              $errors = $null
              $ast = [Management.Automation.Language.Parser]::ParseInput($source, [ref]$tokens, [ref]$errors)
              foreach ($parseError in $errors) { Finding 'powershell-syntax' $Path $parseError.Extent.StartLineNumber }
              $commands = $ast.FindAll({ param($node) $node -is [Management.Automation.Language.CommandAst] }, $true)
              foreach ($command in $commands) {
                  $name = $command.GetCommandName()
                  if (!$name) { continue }
                  $name = ($name -split '\\')[-1]
                  if ($name -notin @('ConvertTo-Json', 'ConvertFrom-Json')) { continue }
                  $serialize = $name -eq 'ConvertTo-Json'
                  $arguments = $command.CommandElements
                  $depth = @()
                  $warnings = @()
                  $splat = $false
                  for ($i = 1; $i -lt $arguments.Count; $i++) {
                      $element = $arguments[$i]
                      if ($element -is [Management.Automation.Language.VariableExpressionAst] -and $element.Splatted) { $splat = $true }
                      if ($element -isnot [Management.Automation.Language.CommandParameterAst]) { continue }
                      $value = $element.Argument
                      if (!$value -and $i + 1 -lt $arguments.Count) { $value = $arguments[$i + 1] }
                      if ($element.ParameterName -match '^(?:d|de|dep|dept|depth)$') {
                          $depth += ($element.ParameterName -eq 'Depth' -and
                              $value -is [Management.Automation.Language.ConstantExpressionAst] -and $value.Value -is [int] -and $value.Value -eq 9)
                      }
                      if ('WarningAction'.StartsWith($element.ParameterName, [StringComparison]::OrdinalIgnoreCase) -or $element.ParameterName -eq 'wa') {
                          $warnings += ($value -is [Management.Automation.Language.StringConstantExpressionAst] -and $value.Value -eq 'Stop')
                      }
                  }
                  $line = $command.Extent.StartLineNumber
                  if ($splat -or $depth.Count -gt 1 -or ($depth.Count -eq 1 -and !$depth[0]) -or ($serialize -and $depth.Count -eq 0)) {
                      Finding 'json-depth' $Path $line
                  }
                  if ($serialize -and ($warnings.Count -ne 1 -or !$warnings[0])) {
                      Finding 'serialization-warning' $Path $line
                  }
              }
          }

          $pr = Invoke-RestMethod -Uri $prUrl -Headers $headers
          if ($pr.head.sha -cne $env:HEAD_SHA -or $pr.base.sha -cne $env:BASE_SHA) { throw 'INCEPTION-GATE: PR advanced during setup.' }
          if ($pr.changed_files -gt 3000) { throw 'INCEPTION-GATE: GitHub cannot list the complete changed-file set.' }

          $paths = [Collections.Generic.List[string]]::new()
          $allPaths = [Collections.Generic.List[string]]::new()
          $seen = [Collections.Generic.HashSet[string]]::new([StringComparer]::Ordinal)
          for ($page = 1; $page -le 30; $page++) {
              $listUrl = $prUrl + '/files?per_page=100&page=' + $page
              $listing = Invoke-WebRequest -Uri $listUrl -Headers $headers
              $files = @(ConvertFrom-Json -InputObject $listing.Content -AsHashtable)
              foreach ($file in $files) {
                  if (!$seen.Add($file.filename)) { throw 'INCEPTION-GATE: duplicate changed-file record.' }
                  $allPaths.Add($file.filename)
                  if ($file.status -ne 'removed') { $paths.Add($file.filename) }
                  if ($file.status -eq 'renamed' -and $file.previous_filename) { $allPaths.Add($file.previous_filename) }
              }
              if ($files.Count -lt 100) { break }
          }
          $findings = @(
              foreach ($path in $paths) {
                  if ($path -match '\.ps(?:1|m1|d1)$') { Find-PowerShellIssues $path }
              }
              try {
                  $policy = Get-SourceText 'AGENTS.md'
                  if ($policy -notmatch '(?m)^# INCEPTION-GATE\s*$' -or
                      !$policy.Contains('`-Depth 9`') -or !$policy.Contains('`-WarningAction Stop`')) {
                      Finding 'agents-policy' 'AGENTS.md'
                  }
              } catch [Text.DecoderFallbackException] { Finding 'invalid-utf8' 'AGENTS.md' }
          )
          $verify = Invoke-RestMethod -Uri $prUrl -Headers $headers
          if ($verify.head.sha -cne $env:HEAD_SHA -or $verify.base.sha -cne $env:BASE_SHA -or
              $seen.Count -ne $verify.changed_files -or $verify.changed_files -ne $pr.changed_files) {
              throw 'INCEPTION-GATE: incomplete or superseded changed-file list.'
          }

          $findings = @($findings | Sort-Object -Property path, line, rule -CaseSensitive -Unique)
          $report = ConvertTo-Json -InputObject $findings -Depth 9 -WarningAction Stop -Compress
          $encoded = [Convert]::ToBase64String([Text.Encoding]::UTF8.GetBytes($report))
          if ($encoded.Length -gt 24000) { throw 'INCEPTION-GATE: findings exceed the receipt budget.' }
          Add-Content -LiteralPath $env:GITHUB_OUTPUT -Value ('findings=' + $encoded)
          $openbsdPaths = '^([.]github/workflows/openbsd-serial-coreao[.]yml|ci/(OPENBSD_SERIAL_COREAO[.]tsv|Invoke-OpenBSDSerialCoreao[.]ps1|Test-OpenBSDSerialCoreao[.]ps1|OPENBSD_8[0]_SOURCE_LOCK[.]tsv|OPENBSD_79_SOURCE_LOCK[.]tsv|OPENBSD_SERIAL_NATIVE_EVIDENCE[.]tsv|Test-OpenBSDNativeEvidence[.]ps1)|docs/OPENBSD_NATIVE_EVIDENCE_V1[.]md|CMakeLists[.]txt|include/.*|shared/.*|tests/std_free_portable_probe[.]cpp)$'
          $openbsd = [bool]($allPaths | Where-Object { $_ -cmatch $openbsdPaths })
          Add-Content -LiteralPath $env:GITHUB_OUTPUT -Value ('openbsd=' + $openbsd.ToString().ToLowerInvariant())
          Write-Output ('INCEPTION-GATE: findings=' + $findings.Count)
