name: MINZA ROT EBG 1-256
on:
  pull_request:
    paths:
      - 'tools/minza_permutation_contract.hpp'
      - 'tests/minza_luzurot_ebg_256_test.cpp'
      - '.github/workflows/minza-rot-ebg-256.yml'
  workflow_dispatch:
jobs:
  pondaz:
    uses: ./.github/workflows/pondaz.yml

  verify:
    needs: pondaz
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Compile in C++20 at O2
        run: |
          g++ -std=c++20 -O2 -Wall -Wextra -Wpedantic -Werror -fstack-protector-strong -D_FORTIFY_SOURCE=2 tests/minza_luzurot_ebg_256_test.cpp -o /tmp/minza_rot_ebg_test
      - name: Run 1..256 roundtrip and matrix tests
        run: /tmp/minza_rot_ebg_test
