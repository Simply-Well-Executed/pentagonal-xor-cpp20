name: REELNATIVE full-source autostart / native tests and gated OCI
# SPDX-License-Identifier: 0BSD
# Branch commits always execute full CMake/CTest native validation.
# Docker build/push needs exact approved base images and independent policy clearance.
on:
  push:
    branches:
      - feat/fresh-artistic-eye-chain-20261120
  workflow_dispatch:
permissions:
  contents: read
  packages: write
concurrency:
  group: swe-full-autostart-${{ github.ref }}
  cancel-in-progress: false
jobs:
  coreao-airgap:
    name: COREAO DASH-REPOSE defensive MagicComb and isolated YANG/YIN
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - name: Fetch exact source before isolation
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference='Stop'
          if($env:GITHUB_REPOSITORY -cne 'Simply-Well-Executed/pentagonal-xor-cpp20' -or $env:RUNNER_OS -cne 'Linux' -or $env:GITHUB_SHA -cnotmatch '^[a-f0-9]{40}
    name: All root, shared and installed-consumer CTest plus normal program execution
    runs-on: windows-2025
    timeout-minutes: 80
    permissions:
      contents: read
    steps:
      - name: Fetch exact complete GitHub source without Node actions
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference='Stop'
          if($env:GITHUB_ACTIONS -cne 'true' -or
             $env:GITHUB_REPOSITORY -cne 'Simply-Well-Executed/pentagonal-xor-cpp20' -or
             $env:RUNNER_OS -cne 'Windows' -or
             $env:GITHUB_SHA -cnotmatch '^[0-9a-f]{40}$'){
            throw 'AUTOSTART|HOLD|untrusted_source_or_runner'
          }
          $zip=Join-Path $env:RUNNER_TEMP 'autostart-source.zip'
          $dir=Join-Path $env:RUNNER_TEMP 'autostart-source'
          $uri='https://api.github.com/repos/'+$env:GITHUB_REPOSITORY+'/zipball/'+$env:GITHUB_SHA
          Invoke-WebRequest -Uri $uri -Headers @{
            Authorization=('Bearer '+$env:GH_TOKEN)
            Accept='application/vnd.github+json'
            'X-GitHub-Api-Version'='2022-11-28'
            'User-Agent'='swe-full-source-autostart'
          } -OutFile $zip -MaximumRedirection 5
          Expand-Archive -LiteralPath $zip -DestinationPath $dir
          $found=@(Get-ChildItem -LiteralPath $dir -Directory)
          if($found.Count -ne 1 -or
             -not [IO.File]::Exists((Join-Path $found[0].FullName 'LICENSES/LOCK.tsv'))){
            throw 'AUTOSTART|HOLD|incomplete_repository_archive'
          }
          [IO.File]::WriteAllText((Join-Path $env:RUNNER_TEMP 'autostart-root.txt'),$found[0].FullName)
      - name: PEEK Warcraft III-inspired arena harness syntax and negative preflight
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $root=[IO.File]::ReadAllText((Join-Path $env:RUNNER_TEMP 'autostart-root.txt'))
          & pwsh -NoLogo -NoProfile -File (Join-Path $root 'ci/Test-PeekGateStaticV1.ps1') -RepositoryRoot $root
          if($LASTEXITCODE -ne 0){throw 'PEEK|HOLD|invalid_trial_harness_cannot_publish'}
      - name: Build complete native targets, execute root/shared/consumer CTest and normal CLI
        shell: pwsh
        run: |
          $root=[IO.File]::ReadAllText((Join-Path $env:RUNNER_TEMP 'autostart-root.txt'))
          & pwsh -NoLogo -NoProfile -File (Join-Path $root 'ci/Invoke-FullSourceAutostartNativeSuite.ps1') -RepositoryRoot $root -OutputDirectory (Join-Path $env:RUNNER_TEMP 'autostart-results') -Platform Windows
          if($LASTEXITCODE -ne 0){throw 'AUTOSTART|HOLD|native_CTest_or_program_start_failed'}
      - name: Preserve separate release-policy and unsupported Android testing HOLD
        if: always()
        shell: pwsh
        run: |
          Write-Host 'AUTOSTART|CUSTODY|ROOT_SHARED_CONSUMER_CTEST_NOT_ALL_ANDROID_JAVA_DEVICE_TESTS'
          Write-Host 'AUTOSTART|CUSTODY|EXISTING_GNU_POSIX_LICENSE_AND_NATIVE_OPENBSD_HOLD_UNCHANGED'
          Write-Host 'AUTOSTART|CUSTODY|EXISTING_OPENBSD1_2_3_EVIDENCE_IMAGES_UNTOUCHED'
  gated-docker:
    name: Full-source Docker tests plus pinned autostart / ${{ matrix.profile }}
    needs: native-full-source
    if: >-
      vars.SWE_AUTOSTART_BASES_APPROVED == 'true' &&
      vars.SWE_AUTOSTART_ALL_TESTS_ATTESTED == 'true' &&
      vars.SWE_AUTOSTART_RELEASE_APPROVED == 'true' &&
      vars.SWE_AUTOSTART_TOOLCHAIN_IMAGE != '' &&
      vars.SWE_AUTOSTART_RUNTIME_IMAGE != ''
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        profile: [openbsd1, openbsd2, openbsd3]
    env:
      TOOLCHAIN_IMAGE: ${{ vars.SWE_AUTOSTART_TOOLCHAIN_IMAGE }}
      RUNTIME_IMAGE: ${{ vars.SWE_AUTOSTART_RUNTIME_IMAGE }}
      SWE_AUTOSTART_BASES_APPROVED: ${{ vars.SWE_AUTOSTART_BASES_APPROVED }}
      SWE_AUTOSTART_ALL_TESTS_ATTESTED: ${{ vars.SWE_AUTOSTART_ALL_TESTS_ATTESTED }}
      SWE_AUTOSTART_RELEASE_APPROVED: ${{ vars.SWE_AUTOSTART_RELEASE_APPROVED }}
      GH_TOKEN: ${{ github.token }}
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
    steps:
      - name: Recover full exact source for Docker and license checks
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $zip=Join-Path $env:RUNNER_TEMP 'autostart-docker-source.zip'
          $dir=Join-Path $env:RUNNER_TEMP 'autostart-docker-source'
          $uri='https://api.github.com/repos/'+$env:GITHUB_REPOSITORY+'/zipball/'+$env:GITHUB_SHA
          Invoke-WebRequest -Uri $uri -Headers @{
            Authorization=('Bearer '+$env:GH_TOKEN)
            Accept='application/vnd.github+json'
            'X-GitHub-Api-Version'='2022-11-28'
            'User-Agent'='swe-full-source-docker'
          } -OutFile $zip -MaximumRedirection 5
          Expand-Archive -LiteralPath $zip -DestinationPath $dir
          $found=@(Get-ChildItem -LiteralPath $dir -Directory)
          if($found.Count -ne 1){throw 'AUTOSTART|DOCKER|HOLD|wrong_source_archive'}
          [IO.File]::WriteAllText((Join-Path $env:RUNNER_TEMP 'autostart-docker-root.txt'),$found[0].FullName)
      - name: Build and run complete-source Docker tests; publish exact autostart image only on pass
        shell: pwsh
        env:
          PROFILE: ${{ matrix.profile }}
        run: |
          $root=[IO.File]::ReadAllText((Join-Path $env:RUNNER_TEMP 'autostart-docker-root.txt'))
          & pwsh -NoLogo -NoProfile -File (Join-Path $root 'ci/Publish-FullSourceAutostartOci.ps1') -RepositoryRoot $root -Profile $env:PROFILE
          if($LASTEXITCODE -ne 0){throw 'AUTOSTART|DOCKER|HOLD|container_validation_or_publication_failed'}
){throw 'DASH-REPOSE|HOLD|untrusted_source'}
          $zip=Join-Path $env:RUNNER_TEMP 'coreao-source.zip'
          $folder=Join-Path $env:RUNNER_TEMP 'coreao-source'
          $uri='https://api.github.com/repos/'+$env:GITHUB_REPOSITORY+'/zipball/'+$env:GITHUB_SHA
          Invoke-WebRequest -Uri $uri -Headers @{ Authorization=('Bearer '+$env:GH_TOKEN); Accept='application/vnd.github+json'; 'User-Agent'='swe-coreao-airgap' } -OutFile $zip
          Expand-Archive -LiteralPath $zip -DestinationPath $folder
          $dirs=@(Get-ChildItem -LiteralPath $folder -Directory)
          if($dirs.Count -ne 1 -or -not [IO.File]::Exists((Join-Path $dirs[0].FullName 'LICENSES/LOCK.tsv'))){throw 'DASH-REPOSE|HOLD|source_missing'}
          [IO.File]::WriteAllText((Join-Path $env:RUNNER_TEMP 'coreao-root.txt'),$dirs[0].FullName)
      - name: Defense first then MagicComb then network-none SPIN9 YANG STAR27 YIN
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $root=[IO.File]::ReadAllText((Join-Path $env:RUNNER_TEMP 'coreao-root.txt'))
          $zip=Join-Path $env:RUNNER_TEMP 'coreao-source.zip'
          & pwsh -NoLogo -NoProfile -File (Join-Path $root 'ci/Invoke-CoreaoAirgapMagicCombV1.ps1') -RepositoryRoot $root -ExactSourceArchive $zip -WorkingDirectory (Join-Path $env:RUNNER_TEMP 'coreao-airgap-v1')
          if($LASTEXITCODE -ne 0){throw 'DASH-REPOSE|HOLD|defense_airgap_yin_yang_failed'}
      - name: Custody labels retained
        if: always()
        shell: pwsh
        run: |
          Write-Host 'DASH-REPOSE|CUSTODY|DOCKER_NETWORK_NONE|CANONICAL_CORE_UNCHANGED|NO_IMAGE_PUSH|NATIVE_OPENBSD_HOLD'
  native-full-source:
    needs: coreao-airgap
    name: All root, shared and installed-consumer CTest plus normal program execution
