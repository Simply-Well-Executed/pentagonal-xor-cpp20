# SPDX-License-Identifier: 0BSD
name: NASCAR Issue Solver Jig | safe diagnostic
on:
  issues:
    types: [opened, reopened]
permissions:
  contents: read
  issues: write
concurrency:
  group: issue-circuit-${{ github.event.issue.number }}
  cancel-in-progress: false
jobs:
  diagnosis:
    name: Revision-pinned issue diagnosis, no source mutation
    runs-on: windows-2025
    timeout-minutes: 20
    permissions:
      contents: read
      issues: write
    steps:
      - name: Read exact workflow source without Node checkout
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          Set-StrictMode -Version 2.0
          $ErrorActionPreference='Stop'
          if($env:GITHUB_REPOSITORY -cne 'Simply-Well-Executed/pentagonal-xor-cpp20' -or $env:GITHUB_EVENT_NAME -cne 'issues' -or $env:RUNNER_OS -cne 'Windows' -or $env:GITHUB_SHA -cnotmatch '^[a-f0-9]{40}$'){throw 'ISSUE_CIRCUIT|HOLD|source_context'}
          $zip=Join-Path $env:RUNNER_TEMP 'issue-circuit.zip'
          $dir=Join-Path $env:RUNNER_TEMP 'issue-circuit-source'
          $url='https://api.github.com/repos/'+$env:GITHUB_REPOSITORY+'/zipball/'+$env:GITHUB_SHA
          $h=@{Authorization='Bearer '+$env:GH_TOKEN;Accept='application/vnd.github+json';'X-GitHub-Api-Version'='2022-11-28'}
          Invoke-WebRequest -Uri $url -Headers $h -OutFile $zip -MaximumRedirection 5
          Expand-Archive -LiteralPath $zip -DestinationPath $dir
          $roots=@(Get-ChildItem -LiteralPath $dir -Directory)
          if($roots.Count -ne 1 -or -not [IO.File]::Exists((Join-Path $roots[0].FullName 'ci/Invoke-IssueCircuit.ps1'))){throw 'ISSUE_CIRCUIT|HOLD|incomplete_source'}
          [IO.File]::WriteAllText((Join-Path $env:RUNNER_TEMP 'issue-circuit-root.txt'),$roots[0].FullName)
      - name: Run allowlisted diagnostics; receipt and comment only
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          Set-StrictMode -Version 2.0
          $ErrorActionPreference='Stop'
          $root=[IO.File]::ReadAllText((Join-Path $env:RUNNER_TEMP 'issue-circuit-root.txt'))
          & pwsh -NoLogo -NoProfile -NonInteractive -File (Join-Path $root 'ci/Invoke-IssueCircuit.ps1') -RepositoryRoot $root -EvidenceDirectory (Join-Path $env:RUNNER_TEMP 'issue-circuit-evidence')
          if($LASTEXITCODE -ne 0){throw 'ISSUE_CIRCUIT|HOLD|solver_failed'}
      - name: Preserve independent approvals
        if: always()
        shell: pwsh
        run: |
          Write-Host 'ISSUE_CIRCUIT|RELEASE=HOLD|NO_AUTO_ACK|NO_AUTO_CLOSE|NO_SOURCE_WRITE'
