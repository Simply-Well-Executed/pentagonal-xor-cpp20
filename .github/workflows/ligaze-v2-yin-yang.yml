name: LIGAZE v2 YANG and YIN MSVC five-profile A/B
on:
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: v2-yin-yang-${{ github.ref }}
  cancel-in-progress: true
jobs:
  pondaz:
    name: 'Pondaz · preflight before all job lanes'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: 'Checkout exact source SHA using PowerShell Core'
        shell: pwsh
        run: |
          Set-StrictMode -Version 2.0
          $ErrorActionPreference = 'Stop'
          if ($env:GITHUB_REPOSITORY -cne 'Simply-Well-Executed/pentagonal-xor-cpp20') { throw 'Unexpected repository' }
          & git init .
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & git remote add origin 'https://github.com/Simply-Well-Executed/pentagonal-xor-cpp20.git'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & git -c advice.detachedHead=false fetch --no-tags --depth 1 origin $env:GITHUB_REF
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & git -c advice.detachedHead=false checkout --detach FETCH_HEAD
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $actual = (& git rev-parse HEAD).Trim()
          if ($LASTEXITCODE -ne 0 -or $actual -cne $env:GITHUB_SHA) { throw 'Pondaz source SHA mismatch' }
      - name: 'Run Pondaz fixture and tracked-text/event input audit'
        shell: pwsh
        run: |
          Set-StrictMode -Version 2.0
          & ./ci/Invoke-Pondaz.ps1 -SelfTest
          if (-not $?) { throw 'Pondaz fixture suite failed' }
          & ./ci/Invoke-Pondaz.ps1 -RepositoryRoot . -EventPath $env:GITHUB_EVENT_PATH -EvidenceDir pondaz-evidence
          if (-not $?) { throw 'Pondaz rejected untrusted input' }

  compare:
    needs: pondaz
    name: Windows x64 YANG 5 and no-GL YIN 5
    runs-on: windows-2025
    timeout-minutes: 45
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Run source release preflight
        run: ./ci/Test-ReleaseSafety.ps1
      - name: Java 17 semantic witness
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Run YANG and no-GL YIN profile comparisons
        run: |
          ./ci/Invoke-LigazeV2YinYang.ps1 -Iterations 500000 -Warmup 50000 -Repeats 5 -Trials 3
          if (!$?) { exit 1 }
      - name: Keep compilation, rejection and latency evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: v2-yin-yang-${{ github.run_id }}
          path: evidence-v2-yin-yang/
          retention-days: 90
          if-no-files-found: warn

  core-yin:
    needs: pondaz
    name: CORE YIN C++20 AVX2 PGO · research only
    runs-on: windows-2025
    timeout-minutes: 50
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: 'Release preflight: reject active hazards'
        run: ./ci/Test-ReleaseSafety.ps1
      - name: JDK 17 semantic reference
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: CORE YIN C++20 original flags and two-phase PGO
        run: |
          ./ci/Invoke-LigazeCoreYin.ps1 -TrainingIterations 500000 -TrainingWarmup 50000 -TrainingRepeats 5
          if (!$?) { exit 1 }
      - name: Archive CORE training and compiler evidence even on error
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ligaze-core-yin-pgo-${{ github.run_id }}
          path: evidence-core-yin-pgo/
          retention-days: 90
          if-no-files-found: warn
