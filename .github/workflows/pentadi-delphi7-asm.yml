# SPDX-License-Identifier: 0BSD
# PENTADI | fifth lane. Invoked ONLY through QuadDi workflow's needs gate.
# No Node actions; PowerShell, native MSVC C11 /O2 /FA and MASM only.
# Proprietary Delphi 7 is opt-in via separately acquired/pinned DCC32.
# Do not fetch/execute WinWorld ISOs or redistribute old compiler binaries.
name: PENTADI | QuadDi C11 to Delphi7 branch witness and ASM
on:
  workflow_call:
permissions:
  contents: read
jobs:
  pentadi:
    name: PentaDi ASM source gate | Delphi7 compiler HOLD unless verified
    runs-on: windows-2025
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Bootstrap exact commit SHA (PowerShell, no Node)
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          Set-StrictMode -Version Latest
          $ErrorActionPreference='Stop'
          if($env:GITHUB_ACTIONS -cne 'true' -or
             $env:RUNNER_OS -cne 'Windows' -or
             $env:GITHUB_REPOSITORY -cne 'Simply-Well-Executed/pentagonal-xor-cpp20' -or
             $env:GITHUB_SHA -cnotmatch '^[0-9a-f]{40}$'){
            throw 'PENTADI|HOLD|invalid_runner_context'
          }
          $uri='https://api.github.com/repos/'+$env:GITHUB_REPOSITORY+'/zipball/'+$env:GITHUB_SHA
          $zip=Join-Path $env:RUNNER_TEMP 'pentadi-pinned-source.zip'
          $stage=Join-Path $env:RUNNER_TEMP 'pentadi-pinned-source'
          Invoke-WebRequest -Uri $uri -Headers @{
            Authorization='Bearer '+$env:GH_TOKEN
            Accept='application/vnd.github+json'
            'X-GitHub-Api-Version'='2022-11-28'
            'User-Agent'='swe-pentadi'
          } -OutFile $zip -MaximumRedirection 5
          Expand-Archive -LiteralPath $zip -DestinationPath $stage
          $roots=@(Get-ChildItem -LiteralPath $stage -Directory)
          if($roots.Count -ne 1 -or
             -not [IO.File]::Exists((Join-Path $roots[0].FullName 'pentadi/PentaDiC11BranchRecords.c')) -or
             -not [IO.File]::Exists((Join-Path $roots[0].FullName 'pentadi/BranchPinToTsht.pas'))){
            throw 'PENTADI|HOLD|incomplete_source_snapshot'
          }
          [IO.File]::WriteAllText((Join-Path $env:RUNNER_TEMP 'pentadi-root.txt'),$roots[0].FullName)
      - name: C11 /O2 execute clean witness then emit verified .asm only
        shell: pwsh
        run: |
          Set-StrictMode -Version Latest
          $ErrorActionPreference='Stop'
          $root=[IO.File]::ReadAllText((Join-Path $env:RUNNER_TEMP 'pentadi-root.txt'))
          & pwsh -NoLogo -NoProfile -NonInteractive -File (Join-Path $root 'pentadi/Invoke-PentaDiQualification.ps1') -RepositoryRoot $root -EvidenceDirectory (Join-Path $env:RUNNER_TEMP 'pentadi-asm-evidence')
          if($LASTEXITCODE -ne 0){throw 'PENTADI|HOLD|c11_masm_or_pipe_failed'}
      - name: PentaPi | bounded local TCP IPv4 TTL 255 framed loopback
        shell: pwsh
        run: |
          Set-StrictMode -Version Latest
          $ErrorActionPreference='Stop'
          $root=[IO.File]::ReadAllText((Join-Path $env:RUNNER_TEMP 'pentadi-root.txt'))
          & pwsh -NoLogo -NoProfile -NonInteractive -File (Join-Path $root 'pentadi/Invoke-PentaPiTcp255.ps1') -EvidenceDirectory (Join-Path $env:RUNNER_TEMP 'pentapi-tcp255-evidence') -InitialIPv4Ttl 255 -TimeoutMilliseconds 2500
          if($LASTEXITCODE -ne 0){throw 'PENTAPI|FAIL|tcp_ipv4_255_gate'}
      - name: PentaPi | five-gate provenance and continuous improvement lap
        shell: pwsh
        run: |
          Set-StrictMode -Version Latest
          $ErrorActionPreference='Stop'
          $root=[IO.File]::ReadAllText((Join-Path $env:RUNNER_TEMP 'pentadi-root.txt'))
          & pwsh -NoLogo -NoProfile -NonInteractive -File (Join-Path $root 'pentadi/Invoke-PentaPiLapAudit.ps1') -RepositoryRoot $root -PentaDiEvidenceDirectory (Join-Path $env:RUNNER_TEMP 'pentadi-asm-evidence') -TcpEvidenceDirectory (Join-Path $env:RUNNER_TEMP 'pentapi-tcp255-evidence') -AuditDirectory (Join-Path $env:RUNNER_TEMP 'pentapi-lap001-evidence')
          if($LASTEXITCODE -ne 0){throw 'PENTAPI|FAIL|five_gate_lap_audit'}
      - name: Hulao Gate | 255 simulated chaos laps and recovery receipts
        shell: pwsh
        run: |
          Set-StrictMode -Version Latest
          $ErrorActionPreference='Stop'
          $root=[IO.File]::ReadAllText((Join-Path $env:RUNNER_TEMP 'pentadi-root.txt'))
          & pwsh -NoLogo -NoProfile -NonInteractive -File (Join-Path $root 'pentadi/Invoke-HulaoChaos255.ps1') -RepositoryRoot $root -EvidenceDirectory (Join-Path $env:RUNNER_TEMP 'hulao-chaos255-evidence') -Rounds 255
          if($LASTEXITCODE -ne 0){throw 'HULAO_CHAOS|FAIL|255_models_or_recovery'}
      - name: Hulao Gate | XHTML 1.0 Strict 256-lap visual and Markdown embed
        shell: pwsh
        run: |
          Set-StrictMode -Version Latest
          $ErrorActionPreference='Stop'
          $root=[IO.File]::ReadAllText((Join-Path $env:RUNNER_TEMP 'pentadi-root.txt'))
          & pwsh -NoLogo -NoProfile -NonInteractive -File (Join-Path $root 'pentadi/Invoke-HulaoVisual256Gate.ps1') -RepositoryRoot $root
          if($LASTEXITCODE -ne 0){throw 'HULAO_VISUAL|FAIL|xhtml_svg_markdown_gate'}
      - name: PentaDi provenance and release gate
        if: always()
        shell: pwsh
        run: |
          Write-Host 'PENTADI|DEPENDENCY=QUADDI_ALL_FOUR_LANES_SUCCESS'
          Write-Host 'PENTADI|DELPHI7=HOLD_UNLESS_USER_PROVISIONED_HASH_PINNED_LICENSED_COMPILER'
          Write-Host 'PENTADI|ASSEMBLY_C11_PRODUCER=MSVC_FA|NOT_DCC32'
          Write-Host 'PENTADI|RELEASE=HOLD|NO_AUTO_MERGE|NO_EXE_DELIVERABLE'
