# SPDX-License-Identifier: 0BSD
# OctaDi G-table: isolated locally installed Python 2.7.18 vs Python 3.
# Source bootstrap via exact GitHub SHA is a CI preflight, not an airgap runtime.
name: OCTADI | G table Python2 Python3 Python23 8 layouts
on:
  push:
    branches-ignore:
      - main
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: octadi-${{ github.ref }}
  cancel-in-progress: false
jobs:
  g-table:
    name: Two real interpreters and 2! plus 3! G table permutations
    runs-on: windows-2025
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Obtain exact source SHA without JavaScript or Python actions
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          Set-StrictMode -Version Latest
          $ErrorActionPreference='Stop'
          if($env:GITHUB_ACTIONS -cne 'true' -or
             $env:GITHUB_REPOSITORY -cne 'Simply-Well-Executed/pentagonal-xor-cpp20' -or
             $env:RUNNER_OS -cne 'Windows' -or
             $env:GITHUB_SHA -cnotmatch '^[a-f0-9]{40}$'){
            throw 'OCTADI|HOLD|untrusted_runner_or_commit'
          }
          $stage=Join-Path $env:RUNNER_TEMP 'octadi-source'
          $zip=Join-Path $env:RUNNER_TEMP 'octadi-source.zip'
          Invoke-WebRequest -Uri ('https://api.github.com/repos/'+$env:GITHUB_REPOSITORY+'/zipball/'+$env:GITHUB_SHA) -Headers @{
            Authorization='Bearer '+$env:GH_TOKEN
            Accept='application/vnd.github+json'
            'X-GitHub-Api-Version'='2022-11-28'
            'User-Agent'='swe-octadi-exact-sha'
          } -OutFile $zip -MaximumRedirection 5
          Expand-Archive -LiteralPath $zip -DestinationPath $stage
          $roots=@(Get-ChildItem -LiteralPath $stage -Directory)
          if($roots.Count -ne 1 -or
             -not [IO.File]::Exists((Join-Path $roots[0].FullName 'octadi/G.py')) -or
             -not [IO.File]::Exists((Join-Path $roots[0].FullName 'octadi/Invoke-OctaDiGTable.ps1'))){
            throw 'OCTADI|HOLD|exact_source_incomplete'
          }
          [IO.File]::WriteAllText((Join-Path $env:RUNNER_TEMP 'octadi-root.txt'),$roots[0].FullName)
      - name: Test both isolated interpreters with all eight G table layouts
        shell: pwsh
        run: |
          Set-StrictMode -Version Latest
          $ErrorActionPreference='Stop'
          $root=[IO.File]::ReadAllText((Join-Path $env:RUNNER_TEMP 'octadi-root.txt'))
          & pwsh -NoLogo -NoProfile -NonInteractive -File (Join-Path $root 'octadi/Invoke-OctaDiGTable.ps1') -RepositoryRoot $root -EvidenceDirectory (Join-Path $env:RUNNER_TEMP 'octadi-g-evidence')
          if($LASTEXITCODE -ne 0){throw 'OCTADI|HOLD|PY2_PY3_G_MATRIX_not_both_verified'}
      - name: Never substitute Python3 for Python2 or promote partial results
        if: always()
        shell: pwsh
        run: |
          Write-Host 'OCTADI|PYTHON2=2.7.18_REQUIRES_LOCAL_RUNTIME'
          Write-Host 'OCTADI|PYTHON3=SEPARATE_LOCAL_RUNTIME'
          Write-Host 'OCTADI|PYTHON23=COMPATIBILITY_STRATEGY_NOT_INTERPRETER'
          Write-Host 'OCTADI|MATRIX=2_BINARY_PLUS_6_TERNARY|NO_IMPORT|NO_PACKAGE_DOWNLOAD'
          Write-Host 'OCTADI|RELEASE=HOLD|NO_AUTO_MERGE'
