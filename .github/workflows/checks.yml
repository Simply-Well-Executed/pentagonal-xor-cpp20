name: Checks

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]

permissions: {}

concurrency:
  group: checks-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  inception_scan:
    permissions:
      contents: read
      pull-requests: read
    uses: ./.github/workflows/inception-scan.yml

  inception_gate:
    name: INCEPTION-GATE
    needs: inception_scan
    runs-on: windows-2025
    timeout-minutes: 10
    permissions:
      issues: write
      pull-requests: read
    steps:
      - name: Create trigger receipts and check maintainer acknowledgment
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          INCEPTION_FINDINGS: ${{ needs.inception_scan.outputs.findings }}
        run: |
          Set-StrictMode -Version 2.0
          $ErrorActionPreference = 'Stop'
          $repo = 'Simply-Well-Executed/pentagonal-xor-cpp20'
          if ($env:GITHUB_REPOSITORY -cne $repo -or $env:PR_NUMBER -notmatch '^[1-9][0-9]{0,8}$' -or
              @($env:HEAD_SHA, $env:BASE_SHA, $env:GITHUB_SHA).Where({ $_ -cnotmatch '^[0-9a-f]{40}$' }).Count -or
              !$env:INCEPTION_FINDINGS -or $env:INCEPTION_FINDINGS.Length -gt 24000) {
              throw 'INCEPTION-GATE: incomplete evidence.'
          }
          $bytes = [Convert]::FromBase64String($env:INCEPTION_FINDINGS)
          $receipt = [Text.UTF8Encoding]::new($false, $true).GetString($bytes)
          $rows = @(ConvertFrom-Json -InputObject $receipt -AsHashtable)
          $rules = @('json-depth', 'serialization-warning', 'powershell-syntax', 'invalid-utf8', 'source-path', 'agents-policy')
          foreach ($row in $rows) {
              if ($row.rule -cnotin $rules -or $row.path -cnotmatch '^(?:[A-Za-z0-9_./-]{1,240}|\[unsupported path\])$' -or
                  $row.line -isnot [ValueType] -or $row.line -lt 1) { throw 'INCEPTION-GATE: invalid finding receipt.' }
          }
          if ($rows.Count -eq 0) { Write-Output 'INCEPTION-GATE: PASS (no findings).'; return }
          if ($env:HEAD_REPO -cne $repo) { throw 'INCEPTION-GATE: held. GitHub restricts automatic issue creation on fork pull requests.' }

          $api = 'https://api.github.com/repos/' + $repo
          $headers = @{ Authorization = 'Bearer ' + $env:GH_TOKEN; Accept = 'application/vnd.github+json'; 'X-GitHub-Api-Version' = '2022-11-28' }
          $prUrl = $api + '/pulls/' + $env:PR_NUMBER
          $pr = Invoke-RestMethod -Uri $prUrl -Headers $headers
          if ($pr.state -ne 'open' -or $pr.head.sha -cne $env:HEAD_SHA -or
              $pr.base.sha -cne $env:BASE_SHA -or $pr.head.repo.full_name -cne $repo) {
              throw 'INCEPTION-GATE: PR changed before review.'
          }

          function Read-Pages([string]$Uri) {
              $separator = if ($Uri.Contains('?')) { '&' } else { '?' }
              for ($page = 1; $page -le 100; $page++) {
                  $url = $Uri + $separator + 'per_page=100&page=' + $page
                  $response = Invoke-WebRequest -Uri $url -Headers $headers
                  $items = @(ConvertFrom-Json -InputObject $response.Content -AsHashtable)
                  $items
                  if ($items.Count -lt 100) { return }
              }
              throw 'INCEPTION-GATE: GitHub pagination limit reached.'
          }

          $issues = @(Read-Pages ($api + '/issues?state=all&creator=github-actions%5Bbot%5D'))
          $pending = [Collections.Generic.List[string]]::new()
          foreach ($group in $rows | Group-Object -Property rule) {
              $groupJson = ConvertTo-Json -InputObject @($group.Group) -Depth 9 -WarningAction Stop -Compress
              $bound = 'INCEPTION/1|' + $repo + '|' + $env:PR_NUMBER + '|' + $env:HEAD_SHA + '|' + $env:GITHUB_SHA + '|' + $groupJson
              $digest = [Convert]::ToHexString([Security.Cryptography.SHA256]::HashData([Text.Encoding]::UTF8.GetBytes($bound))).ToLowerInvariant()
              $title = 'INCEPTION-GATE PR #' + $env:PR_NUMBER + ' ' + $group.Name + ' ' + $digest
              $ack = '/ack-inception ' + $env:HEAD_SHA + ' ' + $digest
              $matches = @($issues | Where-Object { $_.title -ceq $title -and $_.user.login -ceq 'github-actions[bot]' -and !$_.Contains('pull_request') })
              if ($matches.Count -gt 1) { throw 'INCEPTION-GATE: ambiguous issue receipt.' }
              if ($matches.Count -eq 0) {
                  $locations = @($group.Group | Select-Object -First 100 | ForEach-Object { '- `' + $_.path + ':' + $_.line + '`' }) -join [char]10
                  $body = @(
                      'Checks is held for PR #' + $env:PR_NUMBER + '.'
                      'Head: `' + $env:HEAD_SHA + '`'
                      'Tested merge: `' + $env:GITHUB_SHA + '`'
                      'Rule: `' + $group.Name + '` (' + $group.Count + ' findings, first 100 listed)'
                      $locations
                      'To authorize the existing Checks for this revision, comment with exactly:'
                      '```'
                      $ack
                      '```'
                      'Then use Re-run failed jobs on the Checks run. Acknowledgment records review of this trigger and does not waive any downstream check.'
                      ('https://github.com/' + $repo + '/actions/runs/' + $env:GITHUB_RUN_ID)
                  ) -join ([string][char]10 + [char]10)
                  $payload = @{ title = $title; body = $body } | ConvertTo-Json -Depth 9 -WarningAction Stop -Compress
                  $issue = Invoke-RestMethod -Uri ($api + '/issues') -Method Post -Headers $headers -ContentType 'application/json' -Body $payload
              } else { $issue = $matches[0] }
              if ([int]$issue.number -lt 1) { throw 'INCEPTION-GATE: invalid issue receipt.' }
              $comments = @(Read-Pages ($api + '/issues/' + [int]$issue.number + '/comments'))
              $approved = @($comments | Where-Object { $_.user.id -eq 53888432 -and $_.body.Trim() -ceq $ack }).Count -gt 0
              if (!$approved) { $pending.Add('#' + $issue.number) }
              Write-Output ('INCEPTION-GATE: ' + $group.Name + ' issue #' + $issue.number + ' acknowledged=' + $approved)
          }
          if ($pending.Count) { throw ('INCEPTION-GATE: HOLD pending your acknowledgment on ' + ($pending -join ', ')) }
          Write-Output 'INCEPTION-GATE: ACKNOWLEDGED; existing Checks may proceed.'

  source_guard:
    needs: inception_gate
    permissions:
      contents: read
    uses: ./.github/workflows/android-linux-no-python-source.yml

  license_custody:
    needs: inception_gate
    permissions:
      contents: read
    uses: ./.github/workflows/magiccomb-headtail-oracle27-dotnet11-ps77.yml

  triforce:
    needs: inception_gate
    permissions:
      contents: read
    uses: ./.github/workflows/triforce-headtail.yml

  reelnative:
    needs: inception_gate
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/reelnative-fullsource-autostart.yml

  openbsd:
    needs: [inception_scan, inception_gate]
    if: needs.inception_scan.outputs.openbsd == 'true'
    permissions:
      contents: read
    uses: ./.github/workflows/openbsd-serial-coreao.yml
