name: "🛡️ SWE Shared Guard · C++20 Cross-Platform"
on:
  push:
    branches: [main]
    paths:
      - 'shared/**'
      - 'ci/**'
      - '.github/workflows/shared-guard.yml'
  pull_request:
    branches: [main]
    paths:
      - 'shared/**'
      - 'ci/**'
      - '.github/workflows/shared-guard.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  guard:
    name: "${{ matrix.label }}"
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - {label: 'Linux x64', os: ubuntu-24.04, arch: native}
          - {label: 'Linux ARM64', os: ubuntu-24.04-arm, arch: native}
          - {label: 'Windows x64', os: windows-2022, arch: x64}
          - {label: 'Windows x86', os: windows-2022, arch: Win32}
          - {label: 'macOS Intel', os: macos-15-intel, arch: native}
          - {label: 'macOS Apple Silicon', os: macos-15, arch: native}
    steps:
      - name: 'Checkout pinned, without persistent credentials'
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: 'Release pre-flight: reject paused/debug code'
        shell: pwsh
        run: ./ci/Test-ReleaseSafety.ps1

      - name: 'Prepare evidence folder'
        shell: pwsh
        run: New-Item -ItemType Directory -Force -Path evidence | Out-Null
      - name: 'CMake configure'
        shell: pwsh
        run: |
          if ('${{ matrix.arch }}' -eq 'native') {
            & cmake -S shared -B build-shared -DCMAKE_BUILD_TYPE=Release *>&1 | Tee-Object -FilePath evidence/configure.log
          } else {
            & cmake -S shared -B build-shared -A '${{ matrix.arch }}' *>&1 | Tee-Object -FilePath evidence/configure.log
          }
          exit $LASTEXITCODE
      - name: 'Compile with C++20 warnings enabled'
        id: compile
        shell: pwsh
        run: |
          & cmake --build build-shared --config Release --parallel *>&1 | Tee-Object -FilePath evidence/build.log
          exit $LASTEXITCODE
      - name: 'CTest: C11 std-free API, 32-state parity, and negative security fixtures'
        id: test
        shell: pwsh
        run: |
          & ctest --test-dir build-shared -C Release --output-on-failure --output-junit evidence/ctest-results.xml *>&1 | Tee-Object -FilePath evidence/test.log
          exit $LASTEXITCODE
      - name: 'Fingerprint compiler and collect failure/success evidence'
        if: always()
        shell: pwsh
        env:
          BUILD_OUTCOME: ${{ steps.compile.outcome }}
          TEST_OUTCOME: ${{ steps.test.outcome }}
          TARGET_ARCH: ${{ matrix.arch }}
        run: |
          ./ci/Write-CiEvidence.ps1 -BuildDir build-shared -EvidenceDir evidence -BuildOutcome "$env:BUILD_OUTCOME" -TestOutcome "$env:TEST_OUTCOME" -TargetArch "$env:TARGET_ARCH"
      - name: 'Upload per-OS SHA256/PDB/log evidence even on failure'
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: "swe-guard-${{ matrix.label }}"
          path: evidence/
          if-no-files-found: warn
          retention-days: 90

pinned-linux:
    name: "openSUSE Leap pinned Docker x64"
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - name: 'Checkout pinned, without persistent credentials'
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: 'Release pre-flight'
        shell: pwsh
        run: ./ci/Test-ReleaseSafety.ps1
      - name: 'Compile and test in pinned openSUSE image'
        id: container
        shell: pwsh
        env:
          IMAGE_DIGEST: sha256:3e127aa5462cdd8cf5d4a35878983cb7895d0ebeb5679de63e0f35ca67de562d
        run: |
          ./ci/Invoke-PinnedContainerGuard.ps1 -Flavor linux -Image 'paulcheek/opensuse-leap-hardened:latest' -Digest $env:IMAGE_DIGEST -Platform 'linux/amd64'
      - name: 'Capture image and source validation evidence'
        if: always()
        shell: pwsh
        env:
          BUILD_OUTCOME: ${{ steps.container.outcome }}
        run: |
          ./ci/Write-CiEvidence.ps1 -BuildDir build-shared-container -EvidenceDir evidence -BuildOutcome "$env:BUILD_OUTCOME" -TestOutcome "$env:BUILD_OUTCOME" -TargetArch 'linux/amd64'
      - name: 'Upload validation evidence even on failure'
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: swe-pinned-opensuse-x64
          path: evidence/
          if-no-files-found: warn
          retention-days: 90

  pinned-android:
    name: "Android NDK Release compile, pinned Docker x64 host"
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - name: 'Checkout pinned, without persistent credentials'
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: 'Release pre-flight'
        shell: pwsh
        run: ./ci/Test-ReleaseSafety.ps1
      - name: 'Cross-compile Android Release in pinned study image'
        id: container
        shell: pwsh
        env:
          IMAGE_DIGEST: sha256:8ed78faab11b97aaa8f7884dd91b39968e565a7f5359066c32a3f520f9ef35c4
        run: |
          ./ci/Invoke-PinnedContainerGuard.ps1 -Flavor android -Image 'paulcheek/android-source-study-v1:latest' -Digest $env:IMAGE_DIGEST -Platform 'linux/amd64'
      - name: 'Capture image and source compilation evidence'
        if: always()
        shell: pwsh
        env:
          BUILD_OUTCOME: ${{ steps.container.outcome }}
        run: |
          ./ci/Write-CiEvidence.ps1 -BuildDir build-shared-container -EvidenceDir evidence -BuildOutcome "$env:BUILD_OUTCOME" -TestOutcome 'not-run-android-cross-compile' -TargetArch 'arm64-v8a'
      - name: 'Upload validation evidence even on failure'
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: swe-pinned-android-release
          path: evidence/
          if-no-files-found: warn
          retention-days: 90
