name: TRIFORCE ΣΣΣ native TOOLONG HEAD and TAIL
# SPDX-License-Identifier: 0BSD
# Every stage AFTER exact-source bootstrap runs owner Q62 checks at HEAD and TAIL.
# This workflow is validation only; never grants release or third-party license approval.
on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
      - feat/fresh-artistic-eye-chain-20261120
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: triforce-q62-${{ github.ref }}
  cancel-in-progress: false

jobs:
  msvc-toolong-headtail:
    name: Exact Q62 source + native MSVC C++20 /O2 TOOLONG guarded stages
    runs-on: windows-2025
    timeout-minutes: 50
    permissions:
      contents: read
    steps:
      - name: Bootstrap exact SHA source via PowerShell (no Node actions)
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          Set-StrictMode -Version Latest
          $ErrorActionPreference='Stop'
          if($env:GITHUB_ACTIONS -cne 'true' -or
             $env:RUNNER_OS -cne 'Windows' -or
             $env:RUNNER_ENVIRONMENT -cne 'github-hosted' -or
             $env:GITHUB_REPOSITORY -cne 'Simply-Well-Executed/pentagonal-xor-cpp20' -or
             $env:GITHUB_SHA -cnotmatch '^[0-9a-f]{40}$'){
             throw 'TRIFORCE|HOLD|invalid_runner_or_exact_SHA'
          }
          $zip=Join-Path $env:RUNNER_TEMP 'triforce-source.zip'
          $dir=Join-Path $env:RUNNER_TEMP 'triforce-source'
          $url='https://api.github.com/repos/'+$env:GITHUB_REPOSITORY+'/zipball/'+$env:GITHUB_SHA
          Invoke-WebRequest -Uri $url -Headers @{
              Authorization='Bearer '+$env:GH_TOKEN
              Accept='application/vnd.github+json'
              'X-GitHub-Api-Version'='2022-11-28'
              'User-Agent'='swe-triforce-headtail'
          } -OutFile $zip -MaximumRedirection 5
          Expand-Archive -LiteralPath $zip -DestinationPath $dir
          $found=@(Get-ChildItem -LiteralPath $dir -Directory)
          if($found.Count -ne 1 -or
             -not [IO.File]::Exists((Join-Path $found[0].FullName 'shared/toolong_q62_core.hpp')) -or
             -not [IO.File]::Exists((Join-Path $found[0].FullName 'ci/Assert-TriforceHeadTail.ps1'))){
              throw 'TRIFORCE|HOLD|incomplete_exact_source'
          }
          [IO.File]::WriteAllText(
              (Join-Path $env:RUNNER_TEMP 'triforce-root.txt'),$found[0].FullName)
      - name: MSVC and TOOLONG HEAD / TAIL for every controlled stage
        shell: pwsh
        run: |
          Set-StrictMode -Version Latest
          $ErrorActionPreference='Stop'
          $root=[IO.File]::ReadAllText(
              (Join-Path $env:RUNNER_TEMP 'triforce-root.txt'))
          & pwsh -NoLogo -NoProfile -NonInteractive -File (
              Join-Path $root 'ci/Invoke-TriforcePipeline.ps1') `
              -RepositoryRoot $root `
              -EvidenceDirectory (Join-Path $env:RUNNER_TEMP 'triforce-evidence')
          if($LASTEXITCODE -ne 0){
              throw 'TRIFORCE|HOLD|HEAD_TAIL_or_MSVC_TOOLONG_failed'
          }
      - name: Maintain separate human approval and release HOLD
        if: always()
        shell: pwsh
        run: |
          Write-Host 'TRIFORCE|RELEASE=HOLD|HUMAN_APPROVAL=NOT_ASSUMED'
          Write-Host 'TRIFORCE|CI_PASSED_IS_NOT_MERGE_OR_PUBLICATION_APPROVAL'
