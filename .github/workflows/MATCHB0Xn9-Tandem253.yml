# SPDX-License-Identifier: 0BSD
# 253 historical MODEL-ONLY bundles; 9 independent workers converge to
# exactly one local OS-exclusive lane. No PR merge or native status promotion.
name: MATCHB0Xn9 TANDEM253 | historical nine-circuit parallel skydiving
on:
  push:
    branches:
      - feat/quaddi-ni-oracle-cpp20-20261123
  workflow_dispatch:
permissions:
  contents: read
  pull-requests: read
concurrency:
  group: matchb0xn9-tandem253-${{ github.ref }}
  cancel-in-progress: false
jobs:
  historical-tandem-253:
    name: 253 waves | nine entrants each | nine workers | exclusive convergence
    runs-on: windows-2025
    timeout-minutes: 60
    env:
      MSBUILDDISABLENODEREUSE: '1'
      DOTNET_CLI_DO_NOT_USE_MSBUILD_SERVER: '1'
    steps:
      - name: Bootstrap exact Git event source without Node or checkout
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          Set-StrictMode -Version 2.0
          $ErrorActionPreference='Stop'
          if($env:GITHUB_ACTIONS -cne 'true' -or
             $env:RUNNER_OS -cne 'Windows' -or
             $env:GITHUB_REPOSITORY -cne 'Simply-Well-Executed/pentagonal-xor-cpp20' -or
             $env:GITHUB_REF -cne 'refs/heads/feat/quaddi-ni-oracle-cpp20-20261123' -or
             $env:GITHUB_SHA -cnotmatch '^[a-f0-9]{40}$'){
            throw 'TANDEM253|HOLD|UNEXPECTED_RUNNER_OR_GIT_EVENT'
          }
          $zip=Join-Path $env:RUNNER_TEMP 'tandem253-exact-source.zip'
          $dir=Join-Path $env:RUNNER_TEMP 'tandem253-exact-source'
          $uri='https://api.github.com/repos/'+$env:GITHUB_REPOSITORY+'/zipball/'+$env:GITHUB_SHA
          Invoke-WebRequest -Uri $uri -Headers @{
            Authorization='Bearer '+$env:GH_TOKEN
            Accept='application/vnd.github+json'
            'X-GitHub-Api-Version'='2022-11-28'
            'User-Agent'='swe-tandem253'
          } -OutFile $zip -MaximumRedirection 5
          Expand-Archive -LiteralPath $zip -DestinationPath $dir
          $roots=@(Get-ChildItem -LiteralPath $dir -Directory)
          if($roots.Count -ne 1){throw 'TANDEM253|HOLD|ARCHIVE_STRUCTURE'}
          $root=$roots[0].FullName
          foreach($file in @(
            'ci/Invoke-Matchb0xn9Tandem253.ps1',
            'ci/Invoke-Matchb0xn9Race.ps1',
            'ci/MATCHB0Xn9_FESTIVAL_CUSTODY.tsv',
            'ci/Assert-ExternalEvidencePath.ps1'
          )){
            if(-not [IO.File]::Exists((Join-Path $root $file))){
              throw ('TANDEM253|HOLD|SOURCE_FILE_MISSING|'+$file)
            }
          }
          $tokens=$null;$syntaxErrors=$null
          [void][Management.Automation.Language.Parser]::ParseFile(
            (Join-Path $root 'ci/Invoke-Matchb0xn9Tandem253.ps1'),
            [ref]$tokens,[ref]$syntaxErrors)
          if(@($syntaxErrors).Count -ne 0){
            $syntaxErrors | ForEach-Object {Write-Host ('TANDEM253|PARSER_HOLD|'+[string]$_)}
            throw 'TANDEM253|HOLD|POWERSHELL_SYNTAX'
          }
          [IO.File]::WriteAllText((Join-Path $env:RUNNER_TEMP 'tandem253-root.txt'),$root)
      - name: Rotate 26 historical refs through 253 isolated nine-entrant models
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          Set-StrictMode -Version 2.0
          $ErrorActionPreference='Stop'
          $root=[IO.File]::ReadAllText((Join-Path $env:RUNNER_TEMP 'tandem253-root.txt'))
          & pwsh -NoLogo -NoProfile -NonInteractive -File (Join-Path $root 'ci/Invoke-Matchb0xn9Tandem253.ps1') -Mode MASTER -RepositoryRoot $root -EvidenceDirectory (Join-Path $env:RUNNER_TEMP 'tandem253-evidence')
          if($LASTEXITCODE -ne 0){throw 'TANDEM253|HOLD|MODEL_WAVES_NOT_VERIFIED'}
      - name: Keep results separate from real PR admission and release
        if: always()
        shell: pwsh
        run: |
          Write-Host 'TANDEM253|MODE=MODEL_ONLY|WAVES=253|NOT_253_PR_MERGES|NOT_NATIVE_QUALIFICATION|NO_AUTO_MERGE|NO_RELEASE|RELEASE=HOLD'
