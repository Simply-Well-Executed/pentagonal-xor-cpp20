# SPDX-License-Identifier: 0BSD
name: QUADDI NI Oracle Java 27 and C++20 witness
on:
  push:
    branches:
      - feat/quaddi-ni-oracle-cpp20-20261123
    paths:
      - 'quaddi-ni/**'
      - '.github/workflows/quaddi-ni-oracle-cpp20.yml'
  workflow_dispatch:
    inputs:
      seed_power:
        description: "Optional nonnegative seed exponent (default 0)"
        type: string
        required: false
        default: "0"
permissions:
  contents: read
jobs:
  dual-engine:
    runs-on: windows-2025
    timeout-minutes: 35
    env:
      ORACLE_JDK_HOME: ${{ vars.SWE_ORACLE_JDK27_HOME }}
      SELECTED_POWER: ${{ inputs.seed_power }}
    steps:
      - name: Immutable SHA source bootstrap using PowerShell
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          Set-StrictMode -Version Latest
          $ErrorActionPreference='Stop'
          if($env:GITHUB_ACTIONS -cne 'true' -or $env:RUNNER_OS -cne 'Windows' -or $env:GITHUB_REPOSITORY -cne 'Simply-Well-Executed/pentagonal-xor-cpp20' -or $env:GITHUB_SHA -cnotmatch '^[0-9a-f]{40}$'){
            throw 'QUADDI|HOLD|unexpected_runner_or_commit'
          }
          $zip=Join-Path $env:RUNNER_TEMP 'quaddi-exact-source.zip'
          $target=Join-Path $env:RUNNER_TEMP 'quaddi-exact-source'
          $uri='https://api.github.com/repos/'+$env:GITHUB_REPOSITORY+'/zipball/'+$env:GITHUB_SHA
          Invoke-WebRequest -Uri $uri -Headers @{Authorization='Bearer '+$env:GH_TOKEN;Accept='application/vnd.github+json';'X-GitHub-Api-Version'='2022-11-28';'User-Agent'='swe-quaddi-ni'} -OutFile $zip -MaximumRedirection 5
          Expand-Archive -LiteralPath $zip -DestinationPath $target
          $roots=@(Get-ChildItem -LiteralPath $target -Directory)
          if($roots.Count -ne 1 -or -not [IO.File]::Exists((Join-Path $roots[0].FullName 'quaddi-ni/QuadDiNI.cpp'))){
            throw 'QUADDI|HOLD|source_incomplete'
          }
          [IO.File]::WriteAllText((Join-Path $env:RUNNER_TEMP 'quaddi-root.txt'),$roots[0].FullName)
      - name: C++20 native preflight and XHTML zero-power witness
        shell: pwsh
        run: |
          Set-StrictMode -Version Latest
          $ErrorActionPreference='Stop'
          $root=[IO.File]::ReadAllText((Join-Path $env:RUNNER_TEMP 'quaddi-root.txt'))
          $evidence=Join-Path $env:RUNNER_TEMP 'quaddi-native-preflight'
          [IO.Directory]::CreateDirectory($evidence)|Out-Null
          $source=Join-Path $root 'quaddi-ni/QuadDiNI.cpp'
          $before=(Get-FileHash -LiteralPath $source -Algorithm SHA256).Hash
          $vswhere=Join-Path ([Environment]::GetFolderPath('ProgramFilesX86')) 'Microsoft Visual Studio/Installer/vswhere.exe'
          if(-not [IO.File]::Exists($vswhere)){throw 'QUADDI|HOLD|vswhere_missing'}
          $install=@(& $vswhere -latest -products '*' -requires 'Microsoft.VisualStudio.Component.VC.Tools.x86.x64' -property installationPath)
          if($install.Count -ne 1){throw 'QUADDI|HOLD|MSVC_missing'}
          & (Join-Path $install[0] 'Common7/Tools/Launch-VsDevShell.ps1') -Arch amd64 -HostArch amd64 -SkipAutomaticLocation
          $cl=(Get-Command cl.exe -ErrorAction Stop).Source
          $exe=Join-Path $evidence 'quaddi-preflight.exe'
          & $cl /nologo /std:c++20 /O2 /W4 /permissive- /fp:precise /EHsc ('/Fe:'+$exe) $source
          if($LASTEXITCODE -ne 0 -or -not [IO.File]::Exists($exe)){throw 'QUADDI|HOLD|native_preflight_compile_failed'}
          $lines=Join-Path $root 'quaddi-ni/default-lines.tsv'
          $xs=Join-Path $root 'quaddi-ni/default-xs.tsv'
          $misc=Join-Path $root 'quaddi-ni/default-misc.tsv'
          $out=Join-Path $evidence 'seed0-native.tsv'
          & $exe $lines $xs $misc > $out
          if($LASTEXITCODE -ne 0){throw 'QUADDI|HOLD|native_zero_default_failed'}
          $rows=[IO.File]::ReadAllLines($out)
          $expected=[string]::Join([char]9,@('META','1','6','3','1','10','0'))
          if($rows.Count -lt 100 -or $rows[0] -cne $expected){throw 'QUADDI|HOLD|native_zero_metadata_bad'}
          $report=Join-Path $evidence 'quaddi-native-zero.xhtml'
          & pwsh -NoLogo -NoProfile -NonInteractive -File (Join-Path $root 'quaddi-ni/Invoke-Render.ps1') -WitnessFile $out -Destination $report
          if($LASTEXITCODE -ne 0 -or -not [IO.File]::Exists($report)){throw 'QUADDI|HOLD|native_render_failed'}
          $p6=Join-Path $evidence 'seed6-native.tsv'
          & $exe $lines $xs 6 $misc > $p6
          if($LASTEXITCODE -ne 0){throw 'QUADDI|HOLD|native_sixth_power_failed'}
          if($before -cne (Get-FileHash -LiteralPath $source -Algorithm SHA256).Hash){throw 'QUADDI|HOLD|source_mutation'}
          Write-Host 'QUADDI|NATIVE_PREFLIGHT=PASS|SEED_POWER_DEFAULT=0|POWERS=0,6|XHTML=PASS|RELEASE=HOLD'
      - name: Tandem native and Oracle evaluation then scriptless XHTML report
        shell: pwsh
        run: |
          Set-StrictMode -Version Latest
          $ErrorActionPreference='Stop'
          $root=[IO.File]::ReadAllText((Join-Path $env:RUNNER_TEMP 'quaddi-root.txt'))
          $raw=if([string]::IsNullOrWhiteSpace($env:SELECTED_POWER)){'0'}else{$env:SELECTED_POWER}
          if($raw -cnotmatch '^[0-9]{1,10}$'){throw 'QUADDI|HOLD|invalid_seed_power'}
          $n=[long]::Parse($raw)
          if($n -gt 2147483647){throw 'QUADDI|HOLD|seed_power_not_representable'}
          & pwsh -NoLogo -NoProfile -NonInteractive -File (Join-Path $root 'quaddi-ni/Invoke-OracleNativeParity.ps1') -RepositoryRoot $root -EvidenceDirectory (Join-Path $env:RUNNER_TEMP 'quaddi-evidence') -OracleJdkHome $env:ORACLE_JDK_HOME -Power ([int]$n)
          if($LASTEXITCODE -ne 0){throw 'QUADDI|HOLD|qualification_failed'}
      - name: Fail-closed release status
        if: always()
        shell: pwsh
        run: |
          Write-Host 'QUADDI|RELEASE=HOLD|NO_AUTO_MERGE|NO_CERTIFICATION'
