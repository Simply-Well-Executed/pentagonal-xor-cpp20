# SPDX-License-Identifier: 0BSD
name: QUADDI NI | DIAERY-derived native parity
on:
  workflow_dispatch:
    inputs:
      seed_power:
        description: 'Nonnegative seed exponent (default 0)'
        required: false
        default: '0'
        type: string
  pull_request:
    paths:
      - 'quaddi-ni/**'
      - '.github/workflows/quaddi-ni-oracle-cpp20.yml'
permissions:
  contents: read
concurrency:
  group: quaddi-native-parity-${{ github.ref }}
  cancel-in-progress: false
jobs:
  quaddi-concurrence:
    name: Native MSVC /O2 | XHTML witness | Oracle explicit status
    runs-on: windows-2025
    timeout-minutes: 35
    permissions:
      contents: read
    env:
      SELECTED_POWER: ${{ inputs.seed_power }}
    steps:
      - name: Bootstrap exact SHA source (PowerShell only, no Node actions)
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          Set-StrictMode -Version Latest
          $ErrorActionPreference='Stop'
          if($env:GITHUB_ACTIONS -cne 'true' -or
             $env:RUNNER_OS -cne 'Windows' -or
             $env:GITHUB_REPOSITORY -cne 'Simply-Well-Executed/pentagonal-xor-cpp20' -or
             $env:GITHUB_SHA -cnotmatch '^[0-9a-f]{40}$'){
            throw 'QUADDI|HOLD|untrusted_runner_or_sha'
          }
          $zip=Join-Path $env:RUNNER_TEMP 'quaddi-exact-source.zip'
          $destination=Join-Path $env:RUNNER_TEMP 'quaddi-exact-source'
          $uri='https://api.github.com/repos/'+$env:GITHUB_REPOSITORY+'/zipball/'+$env:GITHUB_SHA
          # Source bootstrap ONLY. All subsequent compilation/testing is offline.
          Invoke-WebRequest -Uri $uri -Headers @{
            Authorization='Bearer '+$env:GH_TOKEN
            Accept='application/vnd.github+json'
            'X-GitHub-Api-Version'='2022-11-28'
            'User-Agent'='swe-quaddi-ni'
          } -OutFile $zip -MaximumRedirection 5
          Expand-Archive -LiteralPath $zip -DestinationPath $destination
          $roots=@(Get-ChildItem -LiteralPath $destination -Directory)
          if($roots.Count -ne 1 -or
             -not [IO.File]::Exists((Join-Path $roots[0].FullName 'quaddi-ni/QuadDiNI.cpp'))){
            throw 'QUADDI|HOLD|incomplete_exact_source'
          }
          [IO.File]::WriteAllText((Join-Path $env:RUNNER_TEMP 'quaddi-root.txt'),$roots[0].FullName)
      - name: Provision Oracle JDK 27.0.1.1 from official pinned archive
        shell: pwsh
        run: |
          Set-StrictMode -Version Latest
          $ErrorActionPreference='Stop'
          $root=[IO.File]::ReadAllText((Join-Path $env:RUNNER_TEMP 'quaddi-root.txt'))
          & pwsh -NoLogo -NoProfile -NonInteractive -File (Join-Path $root 'quaddi-ni/Invoke-InstallOracleJdk27.ps1') -EvidenceDirectory (Join-Path $env:RUNNER_TEMP 'oracle-jdk-pinned')
          if($LASTEXITCODE -ne 0){throw 'ORACLE_JDK|HOLD|provision_failed'}
      - name: Qualification | native C++20 seed, XHTML and dynamic source count
        shell: pwsh
        run: |
          Set-StrictMode -Version Latest
          $ErrorActionPreference='Stop'
          $root=[IO.File]::ReadAllText((Join-Path $env:RUNNER_TEMP 'quaddi-root.txt'))
          $text=if([string]::IsNullOrWhiteSpace($env:SELECTED_POWER)){'0'}else{$env:SELECTED_POWER}
          if($text -cnotmatch '^[0-9]+$'){throw 'QUADDI|HOLD|seed_power_not_nonnegative_integer'}
          $value=[Numerics.BigInteger]::Parse($text)
          # A power beyond 6 is independently evaluated by SLIDINGTOOLONGA.
          # The original finite-double baseline continues to qualify 0..6.
          $baseline=if($value -gt 6){0}else{[int]$value}
          & pwsh -NoLogo -NoProfile -NonInteractive -File (Join-Path $root 'quaddi-ni/Invoke-NativeQualification.ps1') -RepositoryRoot $root -EvidenceDirectory (Join-Path $env:RUNNER_TEMP 'quaddi-native-evidence') -Power $baseline
          if($LASTEXITCODE -ne 0){throw 'QUADDI|HOLD|native_qualification_failed'}
      - name: SLIDINGTOOLONGA | exact exponent, BigInteger oracle and XHTML
        shell: pwsh
        run: |
          Set-StrictMode -Version Latest
          $ErrorActionPreference='Stop'
          $root=[IO.File]::ReadAllText((Join-Path $env:RUNNER_TEMP 'quaddi-root.txt'))
          $text=if([string]::IsNullOrWhiteSpace($env:SELECTED_POWER)){'0'}else{$env:SELECTED_POWER}
          if($text -cnotmatch '^[0-9]+$'){throw 'SLIDINGTOOLONGA|HOLD|nonnegative_power_required'}
          & pwsh -NoLogo -NoProfile -NonInteractive -File (Join-Path $root 'quaddi-ni/Invoke-SlidingToolongAQualification.ps1') -RepositoryRoot $root -EvidenceDirectory (Join-Path $env:RUNNER_TEMP 'slidingtoolonga-evidence') -Exponent $text -OracleJdkHome $env:ORACLE_JDK_HOME
          if($LASTEXITCODE -ne 0){throw 'SLIDINGTOOLONGA|HOLD|exact_qualification_failed'}
      - name: GUARDMEMORYGUARD | native and Oracle logical widths and MXRING
        shell: pwsh
        run: |
          Set-StrictMode -Version Latest
          $ErrorActionPreference='Stop'
          $root=[IO.File]::ReadAllText((Join-Path $env:RUNNER_TEMP 'quaddi-root.txt'))
          & pwsh -NoLogo -NoProfile -NonInteractive -File (Join-Path $root 'quaddi-ni/Invoke-SlipSlidingToolongQualification.ps1') -RepositoryRoot $root -EvidenceDirectory (Join-Path $env:RUNNER_TEMP 'slipslidingtoolong-evidence') -OracleJdkHome $env:ORACLE_JDK_HOME
          if($LASTEXITCODE -ne 0){throw 'GUARDMEMORYGUARD|HOLD|qualification_failed'}
      - name: Oracle Java status explicit | exact vendor/version or HOLD
        shell: pwsh
        run: |
          Set-StrictMode -Version Latest
          $ErrorActionPreference='Stop'
          $root=[IO.File]::ReadAllText((Join-Path $env:RUNNER_TEMP 'quaddi-root.txt'))
          if([string]::IsNullOrWhiteSpace($env:ORACLE_JDK_HOME)){
            Write-Host 'QUADDI|JAVA_CPP=HOLD|ORACLE_NOT_PROVISIONED|NATIVE_QUALIFICATION_SEPARATE'
          }else{
            $text=if([string]::IsNullOrWhiteSpace($env:SELECTED_POWER)){'0'}else{$env:SELECTED_POWER}
            if($text -cnotmatch '^[0-9]+$'){throw 'QUADDI|HOLD|seed_power_invalid'}
            $value=[Numerics.BigInteger]::Parse($text)
            $baseline=if($value -gt 6){0}else{[int]$value}
            & pwsh -NoLogo -NoProfile -NonInteractive -File (Join-Path $root 'quaddi-ni/Invoke-OracleNativeParity.ps1') -RepositoryRoot $root -EvidenceDirectory (Join-Path $env:RUNNER_TEMP 'quaddi-oracle-evidence') -OracleJdkHome $env:ORACLE_JDK_HOME -Power $baseline
            if($LASTEXITCODE -ne 0){throw 'QUADDI|HOLD|oracle_native_parity_failed'}
          }
      - name: Browser proof | render Oracle XHTML in native Microsoft Edge
        shell: pwsh
        run: |
          Set-StrictMode -Version Latest
          $ErrorActionPreference='Stop'
          $root=[IO.File]::ReadAllText((Join-Path $env:RUNNER_TEMP 'quaddi-root.txt'))
          $view=Join-Path $env:RUNNER_TEMP 'slidingtoolonga-evidence/slidingtoolonga-oracle-power647.xhtml'
          & pwsh -NoLogo -NoProfile -NonInteractive -File (Join-Path $root 'quaddi-ni/Invoke-BrowserXhtmlSmoke.ps1') -Report $view
          if($LASTEXITCODE -ne 0){throw 'QUADDI|BROWSER=HOLD|browser_validation_failed'}
      - name: Preserve separate human authorization and release HOLD
        if: always()
        shell: pwsh
        run: |
          Write-Host 'QUADDI|RELEASE=HOLD|CI_SUCCESS_IS_NOT_HUMAN_APPROVAL'
          Write-Host 'QUADDI|NO_INCEPTION_GATE_BYPASS|NO_PUBLICATION_AUTHORIZATION'
